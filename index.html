<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>观鸟俱乐部 · 松江印象</title>
<meta name="description" content="在上海松江辨认冬鸟、拜访六处景观，收集你的第一份观鸟手记。海兔与 Ethan8 的策略卡牌游戏。">
<style>
  :root{
    --bg1:#dff0ee; --bg2:#eaf3e4; --bg3:#d2e6ec;
    --ink:#1e3023; --muted:#5c7261;
    --paper:rgba(255,253,247,.93); --paper-solid:#fffdf7;
    --line:#c6d7be; --gold:#e2b042; --accent:#2e6f4e; --lake:#31747e;
    --shadow:0 4px 16px rgba(26,52,38,.09), 0 1px 3px rgba(26,52,38,.06);
    --shadow-lg:0 14px 36px rgba(20,44,32,.18);
  }
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
    color:var(--ink); min-height:100vh; -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(ellipse 68% 44% at 84% 8%, rgba(255,241,196,.72), transparent 72%),
      radial-gradient(ellipse 55% 40% at 15% 18%, rgba(212,240,236,.65), transparent 70%),
      linear-gradient(168deg, #dceef2 0%, #eaf3e6 42%, #d5e8e3 76%, #c7dfe0 100%);
    background-attachment:fixed;
  }

  /* 清晨湖畔氛围背景（纯装饰，不挡操作） */
  .lake-bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .lake-bg svg{position:absolute;left:0;bottom:0;width:100%;height:34vh;min-height:190px;max-height:320px;opacity:.42}
  .lake-mist{position:absolute;inset:auto -10% 14vh -10%;height:90px;
    background:radial-gradient(ellipse at center,rgba(255,255,255,.55) 0%,rgba(255,255,255,0) 72%);
    filter:blur(12px);animation:mistDrift 22s ease-in-out infinite alternate}
  .lake-birds{position:absolute;top:54px;right:7%;width:150px;height:60px;opacity:.34;animation:birdGlide 28s ease-in-out infinite alternate}
  @keyframes mistDrift{from{transform:translateX(-3%) scaleY(1)}to{transform:translateX(3%) scaleY(1.08)}}
  @keyframes birdGlide{from{transform:translate(0,0)}to{transform:translate(-34px,-8px)}}

  .wrap{max-width:1320px;margin:0 auto;padding:10px 14px 86px;position:relative;z-index:1}

  /* 顶部手账标题栏 */
  header.top{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    padding:9px 14px;margin-bottom:8px;
    background:rgba(255,253,246,.82);backdrop-filter:blur(10px);
    border:1px solid rgba(198,215,190,.85);border-radius:16px;box-shadow:var(--shadow);
  }
  header.top h1{font-size:20px;margin:0;display:flex;align-items:center;gap:7px;letter-spacing:.3px;color:#1d4430}
  header.top h1 .sub{font-size:11px;color:var(--lake);font-weight:600;background:#e6f3f1;border:1px solid #c2dfdb;
    padding:2px 8px;border-radius:99px;letter-spacing:.2px}
  .spacer{flex:1}

  button{
    font-family:inherit;cursor:pointer;border:none;border-radius:10px;padding:7px 13px;font-size:13.5px;font-weight:600;
    background:linear-gradient(135deg,#2f7350,#3d8a60);color:#fff;box-shadow:0 2px 8px rgba(32,78,52,.2);
    transition:transform .12s ease, filter .15s ease, box-shadow .15s ease;
  }
  button:hover{filter:brightness(1.06);box-shadow:0 4px 12px rgba(32,78,52,.26)}
  button:active{transform:translateY(1px) scale(.99)}
  button.ghost{background:rgba(255,255,255,.92);color:var(--ink);border:1px solid var(--line);box-shadow:0 1px 4px rgba(26,52,38,.06)}
  button.ghost:hover{background:#f5faf4;border-color:#a8c1a0}
  button.gold{background:linear-gradient(135deg,#e8ba4b,#d9a332);color:#3a2700;box-shadow:0 2px 8px rgba(180,128,20,.22)}
  button.bgm-on{background:linear-gradient(135deg,#e7f5ef,#d9eee8);color:#1d5c4c;border-color:#97c7ba;position:relative}
  button.bgm-on::after{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:#2da47a;
    margin-left:5px;vertical-align:middle;animation:bgmPulse 2.2s ease-in-out infinite}
  @keyframes bgmPulse{0%,100%{opacity:.45;transform:scale(.9)}50%{opacity:1;transform:scale(1.25)}}
  button:disabled{opacity:.42;cursor:not-allowed;filter:none;transform:none}
  button.big{font-size:14.5px;padding:10px 18px;border-radius:11px}
  button.sm{font-size:12px;padding:5px 10px;border-radius:8px}

  .goalbar{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    background:linear-gradient(105deg,#23533c 0%,#2f6f52 55%,#34797d 100%);
    color:#fff;border-radius:14px;padding:9px 15px;margin:7px 0;box-shadow:var(--shadow);
    border:1px solid rgba(255,255,255,.18);
  }
  .goalbar b{font-size:14.5px;letter-spacing:.2px} .goalbar .mini{font-size:12px;opacity:.92}
  .goalbar .prog{flex:1;min-width:120px;height:10px;background:rgba(255,255,255,.22);border-radius:99px;overflow:hidden;
    box-shadow:inset 0 1px 2px rgba(0,0,0,.2)}
  .goalbar .prog i{display:block;height:100%;background:linear-gradient(90deg,#f5d06e,#e8ae38);border-radius:99px;transition:width .4s cubic-bezier(.2,.8,.2,1)}

  .roundhud{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--paper);backdrop-filter:blur(8px);
    border:1px solid var(--line);border-radius:13px;padding:7px 13px;margin:7px 0;box-shadow:var(--shadow);font-size:13px;
  }
  .roundhud .rnd{font-weight:800;color:var(--accent);white-space:nowrap}
  .roundhud .stage{display:flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;background:#ebf2e7;color:var(--muted);white-space:nowrap;font-size:12px;font-weight:600}
  .roundhud .stage.on{background:linear-gradient(135deg,#2e6f4e,#3c8560);color:#fff;font-weight:700;box-shadow:0 2px 6px rgba(46,111,78,.22)}
  .roundhud .seat{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:99px;background:#fff;
    border:1px solid var(--line);font-size:12px;white-space:nowrap}
  .roundhud .seat.now{border-color:var(--gold);background:#fef6df;font-weight:700;animation:seatpulse 1.6s infinite}
  @keyframes seatpulse{0%,100%{box-shadow:0 0 0 0 rgba(226,176,66,0)}50%{box-shadow:0 0 0 4px rgba(226,176,66,.38)}}

  .scoreboard{display:flex;gap:9px;flex-wrap:wrap;margin:7px 0}
  .pchip{
    background:var(--paper);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px;
    padding:8px 13px;min-width:162px;flex:1 1 175px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s;
  }
  .pchip.active{border-color:var(--gold);outline:2px solid rgba(226,176,66,.65);background:#fffef8;transform:translateY(-1px)}
  .pchip .nm{font-weight:700;display:flex;align-items:center;gap:5px;font-size:13px}
  .pchip .sc{font-size:25px;font-weight:800;line-height:1.1;color:#1d4430;margin:2px 0}
  .pchip .det{font-size:11px;color:var(--muted);line-height:1.4}
  .tag{display:inline-block;font-size:10px;background:#e8f3ea;border:1px solid #c3dbc8;color:#276342;border-radius:99px;padding:0 6px;margin-left:3px;font-weight:700}
  .tag.cpu{background:#e7eff6;border-color:#c6d9ea;color:#2f597a}

  .panel{
    background:var(--paper);backdrop-filter:blur(8px);border:1px solid var(--line);
    border-radius:16px;padding:13px 14px;margin-bottom:11px;box-shadow:var(--shadow);
  }
  .panel h2{font-size:13.5px;margin:0 0 9px;color:#1f583d;letter-spacing:.4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .row{display:flex;gap:9px;flex-wrap:wrap;align-items:flex-start}
  .lab{font-size:11.5px;color:var(--muted);margin:0 0 5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .filterbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-left:auto}
  .pillbtn{font-size:11px;padding:3px 9px;border-radius:99px;background:#eef4ec;color:#35563e;border:1px solid #c8d8c4;box-shadow:none;font-weight:600}
  .pillbtn.on{background:#2e6f4e;color:#fff;border-color:#2e6f4e}

  /* ---------- 鸟类卡（带水彩生态插画） ---------- */
  .card{
    width:88px;border-radius:12px;background:#fff;border:1px solid #c9d8c3;box-shadow:0 3px 10px rgba(28,54,38,.11);
    overflow:hidden;position:relative;user-select:none;transition:transform .16s cubic-bezier(.34,1.3,.6,1), box-shadow .16s ease, opacity .15s;
  }
  .card .art{height:56px;display:flex;align-items:center;justify-content:center;background:#eff6ee;overflow:hidden}
  .card .art svg{width:100%;height:100%;display:block}
  .card .nm{font-size:11.5px;font-weight:800;text-align:center;padding:3px 3px 2px;line-height:1.15;color:#1d3323;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .habs{display:flex;justify-content:center;gap:3px;padding:0 3px 4px}
  .hdot{padding:1px 5px;border-radius:4px;border:1px solid rgba(0,0,0,.12);font-size:8.5px;font-weight:700;color:#16331e;line-height:1.25}
  .card .catpill{position:absolute;top:3px;left:3px;font-size:9px;font-weight:700;background:rgba(28,53,37,.84);
    color:#f6faf4;border-radius:5px;padding:1px 5px;backdrop-filter:blur(2px)}
  .card.mini{width:58px;border-radius:9px}
  .card.mini .art{height:38px}
  .card.mini .nm{font-size:9.5px;padding:2px 2px 3px}
  .card.mini .habs{display:none}
  .card.mini .catpill{font-size:7.5px;padding:0 3px;top:2px;left:2px}
  .card.clk{cursor:pointer}
  .card.legal{outline:3px solid #40995c;outline-offset:1px;box-shadow:0 0 0 4px rgba(64,153,92,.14)}
  .card.dim{opacity:.34;filter:grayscale(.45)}
  .card.back{background:repeating-linear-gradient(45deg,#4f6b56,#4f6b56 6px,#46604d 6px,#46604d 12px);color:#e8f4ea}
  .card.back .art{background:transparent;font-size:22px}

  /* ---------- 景观卡 ---------- */
  .lcard{
    width:64px;height:82px;border-radius:11px;color:#13321d;position:relative;box-shadow:0 3px 10px rgba(26,52,38,.12);
    display:flex;flex-direction:column;align-items:center;justify-content:center;border:1.5px solid rgba(255,255,255,.55);
    user-select:none;transition:transform .16s cubic-bezier(.34,1.3,.6,1), box-shadow .16s ease;
  }
  .lcard::after{content:'';position:absolute;inset:3px;border:1px solid rgba(255,255,255,.35);border-radius:8px;pointer-events:none}
  .lcard .ic{font-size:21px;line-height:1.1} .lcard .ln{font-weight:800;font-size:12px;margin-top:2px}
  .lcard .gp{font-size:9.5px;font-weight:700;background:rgba(20,42,28,.45);color:#fff;border-radius:99px;padding:0 6px;margin-top:3px}
  .lcard.clk{cursor:pointer} .lcard.clk:hover{transform:translateY(-3px);box-shadow:0 8px 18px rgba(24,52,36,.2)}
  .lcard.legal{outline:3px solid #2e7d47;outline-offset:2px}
  .lcard.sel{outline:3px solid var(--gold);outline-offset:2px;transform:translateY(-4px)}
  .lcard .cnt{position:absolute;top:-7px;right:-7px;background:#233b2a;color:#fff;border-radius:50%;width:21px;height:21px;
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;border:1.5px solid #fff;z-index:2}

  /* ---------- 图鉴卡 ---------- */
  .gcard{
    width:120px;border-radius:11px;border:1px solid #dcc89b;
    background:linear-gradient(165deg,#fffaf0,#fcefd4);
    box-shadow:0 3px 9px rgba(60,48,20,.1);padding:6px 7px 23px;position:relative;user-select:none;
    transition:transform .16s cubic-bezier(.34,1.3,.6,1), box-shadow .16s ease, opacity .18s ease;
  }
  .gcard.lv2{border-color:#b5cde0;background:linear-gradient(165deg,#f5faff,#dfeefc)}
  .gcard .gh{font-weight:800;font-size:11.5px;display:flex;justify-content:space-between;align-items:center;gap:3px;color:#273b2c}
  .gcard .pts{background:linear-gradient(135deg,#ecc254,#d89d28);color:#3a2700;border-radius:99px;padding:0 6px;font-weight:800;font-size:10.5px}
  .gcard .req{font-size:10px;line-height:1.35;color:#5d4f32;margin-top:4px;font-weight:600}
  .gcard .keep{font-size:9px;color:#2e6f4e;margin-top:3px;font-weight:600}
  .gcard.clk{cursor:pointer} .gcard.clk:hover{transform:translateY(-3px);box-shadow:0 10px 22px rgba(24,52,36,.2)}
  .gcard.legal{outline:3px solid #40995c;outline-offset:1px;box-shadow:0 0 0 4px rgba(64,153,92,.16)}
  .gcard.dim{opacity:.38}
  .gcard.gmuted{opacity:.24;filter:grayscale(.45)}
  .gcard .gprog{position:absolute;left:4px;right:4px;bottom:4px;font-size:10px;font-weight:700;text-align:center;
    border-radius:7px;padding:1px 4px;background:rgba(36,54,40,.82);color:#ffebb9;line-height:1.3}
  .gcard .gprog.ok{background:rgba(40,115,62,.95);color:#ecffec}
  .gcard .gprog.near{background:rgba(191,126,22,.94);color:#fff}
  .gpool{display:flex;gap:7px;flex-wrap:wrap}

  /* ---------- 鸟类群落 ---------- */
  .groups{display:flex;gap:11px;flex-wrap:wrap}
  .group{border:2px dashed #c0d2ba;border-radius:15px;padding:8px 10px;background:rgba(251,253,248,.88);position:relative;min-width:162px;transition:border-color .15s, background .15s}
  .group.metgd{border-color:#4b9a62;background:#f0faf1}
  .group.sel{border-color:var(--gold);border-style:solid;background:#fff9e8}
  .group .ghd{font-size:11px;color:var(--muted);margin-bottom:5px;display:flex;align-items:center;gap:6px}
  .group .ghd b{color:var(--accent);font-size:12px}
  .habs2{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
  .hab{display:flex;gap:5px;align-items:flex-start;padding:5px;border-radius:10px;background:rgba(255,255,255,.78);border:1px solid rgba(198,215,190,.55)}
  .hab.closed{opacity:.62}
  .hab .bslots{display:flex;gap:4px;align-items:center}
  .slot{width:56px;height:74px;border:1.5px dashed #bfd0b6;border-radius:9px;display:flex;align-items:center;
    justify-content:center;color:#93a68c;font-size:10.5px;text-align:center;line-height:1.25;font-weight:600}
  .slot.clk{cursor:pointer;border-color:#44965c;color:#2f7545;background:#eef9ee}
  .slot.clk:hover{background:#e1f3e2}
  .addhab{width:58px;height:82px;border:2px dashed #b4c7ad;border-radius:10px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;color:#7e9378;font-size:10.5px;cursor:default;line-height:1.3;text-align:center;font-weight:600}
  .addhab.clk{cursor:pointer;border-color:#44965c;color:#2f7545;background:#eef9ee}
  .newgroup{border:2px dashed #b4c7ad;border-radius:15px;padding:12px 15px;min-width:124px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;color:#7e9378;font-size:11.5px;text-align:center;line-height:1.45;font-weight:600}
  .newgroup.clk{cursor:pointer;border-color:#44965c;color:#2f7545;background:#eef9ee}

  .achcard{width:148px;border-radius:11px;background:linear-gradient(145deg,#fff8e7,#fdebc9);border:1px solid #e1b85b;
    padding:7px 9px;box-shadow:0 3px 8px rgba(100,72,18,.1);position:relative;user-select:none;transition:transform .14s}
  .achcard.taken{opacity:.36;filter:grayscale(.6)}
  .achcard.legal{outline:3px solid #40995c;outline-offset:1px;cursor:pointer;transform:translateY(-2px)}
  .achcard .id{font-weight:800;color:#8e6000;font-size:12.5px}
  .achcard .tx{font-size:10.5px;color:#624d24;margin-top:3px;line-height:1.35}
  .achcard .p{position:absolute;top:6px;right:7px;background:var(--gold);color:#3a2700;border-radius:99px;padding:0 6px;font-weight:800;font-size:10.5px}

  .actionbar{
    position:sticky;bottom:8px;background:rgba(255,253,247,.96);backdrop-filter:blur(10px);
    border:1px solid #b9ceb2;border-radius:16px;padding:12px 15px;box-shadow:0 -2px 20px rgba(26,52,38,.14);margin-top:10px;z-index:20;
  }
  .actionbar .prompt{font-size:14.5px;font-weight:700;margin-bottom:8px;min-height:20px;color:#1d3926;line-height:1.45}
  .actionbar .btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.45}
  .step{display:inline-block;font-size:11px;background:#eaf1e6;border:1px solid var(--line);border-radius:99px;padding:2px 10px;margin-right:6px;font-weight:600}
  .step.done{background:#dcf0dc;color:#2c6f42;border-color:#b2d7b9}
  .step.now{background:linear-gradient(135deg,#ecc254,#dfaa37);color:#3a2700;font-weight:800;border-color:#d49e2a}

  .log{max-height:140px;overflow:auto;font-size:11.5px;line-height:1.55;color:#3d4f40;background:#f4f8f1;border-radius:11px;padding:8px 10px;border:1px solid #dfeadb}
  .log div{padding:2px 0;border-bottom:1px solid #e7efe4}
  .opp{flex:1;min-width:215px;background:rgba(251,253,248,.92);border:1px solid var(--line);border-radius:13px;padding:9px 11px;font-size:11.5px}
  .opp .on{font-weight:800;font-size:12.5px;color:#1f4830}
  .opp .gsum{color:#536655;margin-top:3px;line-height:1.5}

  .overlay{position:fixed;inset:0;background:rgba(20,38,28,.54);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
  .modal{background:var(--paper-solid);border:1px solid var(--line);border-radius:20px;padding:22px;max-width:620px;width:100%;box-shadow:var(--shadow-lg);max-height:90vh;overflow:auto}
  .modal h2{margin-top:0;color:#1e563a}
  .setrow{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap}
  .setrow input[type=text]{flex:1;min-width:90px;padding:7px 10px;border:1px solid var(--line);border-radius:9px;font-family:inherit}
  .setrow select{padding:7px 9px;border:1px solid var(--line);border-radius:9px;font-family:inherit;background:#fff}
  .winrow{display:flex;justify-content:space-between;padding:8px 12px;border-radius:10px;margin:5px 0;background:#f2f7ef}
  .winrow.first{background:linear-gradient(135deg,#fff3cf,#ffe59e);font-weight:800;border:1px solid #e7c060}
  .rules{font-size:13px;line-height:1.68}.rules h3{color:var(--accent);margin:13px 0 4px;font-size:14px}
  .note{font-size:11.5px;background:#fff7e2;border:1px solid #e5bd5a;border-radius:10px;padding:8px 11px;line-height:1.52;color:#664e21}

  /* ===== 沉浸体验：阶段横幅 / 区域聚光 / 飞牌 / 望远镜观鸟 / 悬浮放大 ===== */
  .phasebanner{position:fixed;left:50%;top:32%;transform:translate(-50%,-50%) scale(.82);z-index:9600;pointer-events:none;
    background:linear-gradient(135deg,#22543d,#347a57);color:#fff;padding:16px 32px;border-radius:18px;
    box-shadow:0 18px 48px rgba(10,32,20,.4);font-size:22px;font-weight:800;letter-spacing:.05em;opacity:0;
    animation:pbAnim 1.45s cubic-bezier(.2,.9,.3,1) forwards;text-align:center;border:1px solid rgba(255,255,255,.22)}
  .phasebanner .sub{display:block;font-size:13px;font-weight:400;opacity:.92;margin-top:4px;letter-spacing:.02em}
  .phasebanner.ob{background:linear-gradient(135deg,#235166,#33758a)}
  @keyframes pbAnim{0%{opacity:0;transform:translate(-50%,-50%) scale(.82)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.03)}24%{transform:translate(-50%,-50%) scale(1)}82%{opacity:1}100%{opacity:0;transform:translate(-50%,-56%) scale(1)}}

  .zone-hot{outline:3px solid rgba(226,176,66,.92);outline-offset:4px;border-radius:13px;animation:zonepulse 1.7s infinite}
  @keyframes zonepulse{0%,100%{box-shadow:0 0 0 0 rgba(226,176,66,0)}50%{box-shadow:0 0 0 8px rgba(226,176,66,.26)}}

  .obs-ov{position:fixed;inset:0;z-index:9998;pointer-events:none;overflow:hidden}
  .iris{position:fixed;left:50%;top:50%;width:48vmin;height:48vmin;border-radius:50%;
    box-shadow:0 0 0 100vmax rgba(10,24,18,.86),inset 0 0 0 8px rgba(255,255,255,.14),inset 0 0 36px 12px rgba(20,60,44,.45);
    transform:translate(-50%,-50%) scale(2.3);opacity:0;animation:irisA 1.35s ease forwards}
  @keyframes irisA{0%{transform:translate(-50%,-50%) scale(2.3);opacity:0}16%{opacity:1}34%{transform:translate(-50%,-50%) scale(1)}72%{transform:translate(-50%,-50%) scale(1.04)}100%{transform:translate(-50%,-50%) scale(2.3);opacity:0}}
  .obs-label{position:fixed;left:50%;bottom:14%;transform:translateX(-50%);background:rgba(18,40,30,.78);color:#fff;

.wrap .lcard img{width:100%;height:35px;border-radius:2px;object-fit:cover}.wrap .lcard .ln{font-size:13px;line-height:1.2;margin:3px 0 0;color:#284535;white-space:nowrap}.wrap .lcard .sj-site-tag{text-align:center}
.wrap .card.legal,.wrap .lcard.legal,.wrap .gcard.legal{outline:2px solid #448664;outline-offset:-1px;box-shadow:none;animation:none}
.wrap .card.sel,.wrap .lcard.sel{outline:2px solid #af7223;outline-offset:-2px;transform:translateY(-2px);box-shadow:0 2px 4px #7353243d}
@media(hover:hover) and (pointer:fine){
  .wrap .card.clk:not(.sel):hover{border-color:#54735c;box-shadow:inset 0 0 0 1px #739879}
}
.sj-arrived{animation:sj-arrival .6s ease-out}
@keyframes sj-arrival{from{box-shadow:inset 0 0 0 3px #b87829}to{box-shadow:inset 0 0 0 0 transparent}}
.wrap .card.mini{width:58px;flex:none}.wrap .card.mini .art{height:34px}.wrap .card.mini .nm{padding:3px 0 1px;font-size:11.5px;line-height:1.24;white-space:normal;overflow-wrap:anywhere;text-overflow:clip}.wrap .card.mini .catpill,.wrap .card.mini .habs{display:none}
#market{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));max-width:510px;gap:8px}#market .card{width:100%}
.sj-resources{display:grid;grid-template-columns:max-content minmax(0,1fr);align-items:start;gap:9px 32px}.sj-hand-section,.sj-group-section{margin-top:13px}
.wrap .zone-hot{outline:0;box-shadow:none;background:none;animation:none}.wrap .newgroup,.wrap .addhab,.wrap .slot{border-radius:5px;min-height:44px}
.wrap .newgroup{min-width:0;padding:10px;color:#546b57;font-size:12px}.wrap .group{max-width:100%;min-width:0;border-radius:6px}
.wrap .slot.clk,.wrap .addhab.clk,.wrap .newgroup.clk{background:#e4efcf;border:2px solid #628963;color:#244c37}
.wrap .group .hab{max-width:100%;flex-wrap:wrap}.wrap .group .bslots{max-width:100%;flex-wrap:wrap}
.wrap .group .ghd,.wrap .habs2,.wrap .groups{max-width:100%}.phasebanner{pointer-events:none;font-size:16px;padding:9px 15px;top:12px;bottom:auto;box-shadow:none}.phasebanner .sub{display:none}
@media(max-width:820px){
  #sj-screen{padding:0 15px 12px}.sj-head{height:56px}.sj-brand{font-size:16px;gap:6px}.sj-brand-mark{width:33px;height:33px}
  .sj-hero{grid-template-columns:42% 58%;min-height:295px}.sj-hero-copy{padding:22px}.sj-hero h1 span{font-size:47px}
  .sj-hero .sj-actions{gap:7px}.sj-hero .sj-actions button{padding:9px 12px}
  .sj-places{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.sj-stop-grid{grid-template-columns:1fr 1.05fr;gap:15px}
  .sj-board-grid{grid-template-columns:minmax(0,1fr);gap:8px}.sj-table-play{display:contents}.sj-table-side{gap:8px}
  .phasebanner,.obs-ov{display:none}
  .wrap #sj-stepbar.sj-observe-turn{position:sticky;top:0;z-index:3;box-shadow:0 2px 4px #25453429}
  .sj-sighting{display:none!important}body[data-sj-view=board] .wrap{padding:0 10px 18px}.wrap .panel{padding:10px}
  .sj-table-brand{font-size:19px}.sj-table-brand span{font-size:11px}.sj-table-nav{gap:1px}.sj-table-nav>button,.sj-menu summary{padding:4px 7px;font-size:13px}
  .wrap .actionbar{padding:9px 10px}.wrap .panel h2{font-size:20px}.sj-statusline{padding:7px 0}
}
@media(min-width:581px) and (max-width:990px){
  .sj-hero{grid-template-columns:minmax(0,1fr);min-height:0}
  .sj-art{grid-area:1/1;min-height:0;aspect-ratio:2.25}
  .sj-hero-copy{grid-area:2/1;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 16px;padding:16px 22px}
  .sj-hero-copy:after{display:none}
  .sj-hero .sj-eye{grid-area:1/1;margin:0;font-size:11px}
  .sj-hero h1{grid-area:2/1;display:flex;align-items:baseline;gap:9px;font-size:22px}
  .sj-hero h1 span{margin:0;font-size:40px}
  .sj-hero .sj-deck{grid-area:3/1;margin:4px 0 0;max-width:none;font-size:14px}
  .sj-hero .sj-actions{grid-area:1/2/4/3;align-self:center}
}
@media(max-width:580px){
  .sj-head{height:53px}.sj-nav{gap:12px}.sj-nav button{font-size:12px}
  .sj-hero{display:flex;flex-direction:column;margin-top:9px;border-radius:6px;min-height:0}
  .sj-art{order:-1;z-index:0;width:100%;min-height:0;aspect-ratio:1.86}
  .sj-art img{object-position:56% 48%}.sj-hero-copy{align-self:stretch;padding:16px 17px 18px}
  .sj-hero-copy:after{left:0;top:-7px;width:100%;height:9px;clip-path:polygon(0 48%,11% 55%,17% 32%,27% 48%,39% 27%,51% 56%,60% 30%,74% 53%,82% 29%,94% 48%,100% 32%,100% 100%,0 100%)}
  .sj-hero .sj-eye{font-size:11px;margin:0 0 4px}.sj-hero h1{font-size:20px;display:flex;align-items:baseline;gap:9px;letter-spacing:.01em}
  .sj-hero h1 span{margin:0;font-size:clamp(30px,8.2vw,44px);letter-spacing:.01em}.sj-hero .sj-deck{font-size:14px;margin:8px 0 12px}
  .sj-actions{gap:8px}.sj-hero .sj-actions button{min-height:44px;padding:8px 15px}
  .sj-section{padding:16px 0}.sj-section-head{gap:6px;margin-bottom:8px}.sj-section-head h2{font-size:22px}
  .sj-places button{padding:4px;gap:4px}.sj-places img{height:35px;width:33%}.sj-places b{font-size:12px}.sj-places small{font-size:10px}
  .sj-foot{gap:4px;font-size:11px;padding:8px 0}.sj-page{padding:13px 0 18px;min-height:0}.sj-page h1{margin:6px 0 9px;font-size:30px}
  .sj-routebar{padding-bottom:7px;margin-bottom:10px}.sj-routebar li{font-size:12px}.sj-routebar li+li:before{margin:0 6px}
  .sj-stop-grid{display:block}.sj-stop-art{margin-bottom:12px}.sj-stop-art img{aspect-ratio:2.3;object-position:center 53%}.sj-stop-art figcaption{font-size:12px;left:7px;bottom:6px}
  .sj-question{font-size:15px;margin-bottom:9px}.sj-cards{gap:7px}.sj-pick img{max-height:116px}.sj-cite{font-size:11px}
  .sj-stop{padding:13px}.sj-find,.sj-result{gap:12px}.sj-find>div:first-child,.sj-result-bird{width:79px}.sj-path-card img{width:59px}
  .sj-ledger span{padding-left:7px}.sj-library{grid-template-columns:repeat(2,minmax(0,1fr))}.sj-sites-list{grid-template-columns:1fr}
  .sj-table-brand{display:block;text-align:left;font-size:17px;line-height:1.2}.sj-table-brand span{display:block;font-size:10px}
  .sj-table-nav>button,.sj-menu summary{font-size:12px;padding:4px 6px}.wrap header.top{min-height:48px}
  .sj-statusline{gap:4px}.wrap .roundhud{gap:5px;font-size:12px}.wrap .goalbar{gap:4px}.wrap .goalbar b{font-size:12px}.wrap #progtxt{font-size:14px}.wrap .goalbar .prog{width:30px}
  .wrap .actionbar{grid-template-columns:minmax(0,1fr) auto;gap:3px 6px;min-height:64px}
  .wrap .actionbar .prompt{font-size:12px}.wrap .actionbar .hint{font-size:12px}.wrap .actionbar button{font-size:11px;padding:5px 7px}.wrap .actionbar .step{margin-right:2px;font-size:10px;padding:2px 4px}
  .wrap .card{width:62px}.wrap .card .art{aspect-ratio:1.12}.wrap .card .nm{font-size:11px}.wrap .card .catpill,.wrap .hdot{font-size:8px}
  .sj-resources{gap:6px 22px}.wrap .lcard{width:65px}.wrap .lcard img{height:28px}.wrap .lcard .ln{font-size:12px}
  .wrap .row,#market{gap:4px}.sj-hand-section,.sj-group-section{margin-top:9px}.wrap .lab{margin-bottom:4px}.sj-panel-title{margin-bottom:4px;min-height:35px}
  .wrap .group .hab{padding:3px}.wrap .hab .lcard{width:46px}
  .sj-drawer .gpool{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
.sj-route-choices{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:100%}
.sj-path-card{display:block;min-width:0;padding:0;overflow:hidden;border-color:#a5b19b}
.sj-path-card .sj-path-scene{display:block;width:100%;height:clamp(120px,13vw,168px);border-radius:0;object-fit:cover;object-position:50% 57%}
.sj-path-caption{display:flex;align-items:center;gap:12px;padding:11px}.sj-path-caption .sj-bird-art{width:54px;flex:none}
.sj-finish-grid,.sj-setup-grid{display:grid;grid-template-columns:.93fr 1.07fr;gap:24px;align-items:center}
.sj-finish-grid{margin-bottom:16px}.sj-finish-grid .sj-stop{margin-top:0}.sj-finish-grid .sj-stop-art img{aspect-ratio:1.68}
.sj-setup{max-width:965px}.sj-setup-grid{margin-top:4px}.sj-setup-grid .sj-stop-art img{aspect-ratio:1.22}
@media(min-width:821px){
  #market{max-width:690px;grid-template-columns:repeat(5,minmax(0,1fr))}
  #market .card .art{aspect-ratio:1.36}#market .card .nm{font-size:14px}
  #mybody{display:grid;grid-template-columns:minmax(220px,1.05fr) minmax(160px,1fr);gap:10px 16px;align-items:start}
  .sj-group-section{grid-column:2;grid-row:1 / span 2;border-left:1px solid var(--sj-rule);padding-left:12px;align-self:stretch;margin:0}
  .sj-hand-section{grid-column:1;margin:0}.sj-resources{gap:10px}
}
@media(max-width:700px){
  .sj-path-caption{padding:8px;gap:7px}.sj-path-caption .sj-bird-art{width:35px}.sj-route-choices{gap:8px}
  .sj-finish-grid,.sj-setup-grid{display:block}.sj-setup-grid .sj-stop-art img,.sj-finish-grid .sj-stop-art img{aspect-ratio:3.1}
}
@media(max-width:500px){
  .sj-route-choices{grid-template-columns:1fr}.sj-path-card{display:grid;grid-template-columns:75px 1fr;align-items:stretch}
  .sj-path-card .sj-path-scene{width:75px;height:100%;min-height:80px}.sj-path-caption{display:block}
  .sj-path-caption .sj-bird-art{display:none}.sj-path-caption b{font-size:17px}.sj-path-caption small{font-size:13px}
}

    GD(1,'湿地',{'涉禽':1,'游禽':1},'游禽',7),   GD(1,'天空',{'游禽':1,'鸣禽':1},'攀禽',8),
    GD(1,'沙地',{'猛禽':1,'陆禽':1},'游禽',9),   GD(1,'湖泊',{'游禽':1,'猛禽':1},'陆禽',10),
    GD(1,'草地',{'攀禽':1,'鸣禽':1},'攀禽',11),  GD(1,'树冠',{'攀禽':1,'涉禽':1},'陆禽',12),
    GD(2,'天空',{'猛禽':2,'攀禽':1},'鸣禽',1),   GD(2,'树冠',{'攀禽':2,'涉禽':1},'涉禽',2),
    GD(2,'湿地',{'涉禽':2,'攀禽':1},'陆禽',3),   GD(2,'天空',{'猛禽':1,'涉禽':1,'游禽':1},'猛禽',4),
    GD(2,'草地',{'鸣禽':2,'涉禽':1},'陆禽',5),   GD(2,'沙地',{'陆禽':1,'猛禽':1,'游禽':1},'涉禽',6),
    GD(2,'树冠',{'涉禽':1,'陆禽':1,'攀禽':1},'游禽',7), GD(2,'湖泊',{'猛禽':1,'游禽':1,'陆禽':1},'鸣禽',8),
    GD(2,'湿地',{'游禽':1,'攀禽':1,'鸣禽':1},'游禽',9), GD(2,'草地',{'猛禽':1,'攀禽':1,'陆禽':1},'猛禽',10),
    GD(2,'湖泊',{'游禽':2,'陆禽':1},'攀禽',11),  GD(2,'沙地',{'陆禽':2,'鸣禽':1},'攀禽',12),
  ];
  const GUIDE_BY_ID = {}; GUIDES.forEach(g=>GUIDE_BY_ID[g.id]=g);

  /* --------------------------- 成就（8 张，8/31 稿，每人限 1） ---------- */
  function AC(i, req, pts){ return { id:i, req, pts,
    name:'成就'+i+'('+Object.keys(req).map(k=>k.slice(0,1)+req[k]).join('')+'='+pts+'分)' }; }
  const ACH = [
    AC(1,{'草地':2,'天空':1,'沙地':1},2),
    AC(2,{'湖泊':1,'沙地':1,'树冠':1,'草地':1},2),
    AC(3,{'湖泊':1,'湿地':1,'天空':1,'沙地':1},2),
    AC(4,{'树冠':1,'湖泊':1,'天空':1,'湿地':1},2),
    AC(5,{'沙地':2,'天空':1,'湖泊':1,'湿地':1},4),
    AC(6,{'湿地':2,'树冠':1,'湖泊':1,'沙地':1},4),
    AC(7,{'湖泊':1,'草地':1,'树冠':1,'湿地':1,'沙地':1},4),
    AC(8,{'天空':2,'树冠':1,'湖泊':1,'草地':1},4),
  ];

  /* --------------------------- 基础工具 ---------------------------------- */
  function makeRng(seed){ let s=((seed==null?0x9e3779b9:seed)>>>0); return function(){ s|=0; s=(s+0x6D2B79F5)|0; let t=Math.imul(s^(s>>>15),1|s); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
  function shuffle(a,rng){ const x=a.slice(); for(let i=x.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); const t=x[i];x[i]=x[j];x[j]=t; } return x; }
  /* 牌库构成：
       null      → 原版 12 种 × 6 张 = 72
       'even'    → 每种各 +1 张 = 84（种类不变，只是每种 7 张）
       'stretch' → 作者 8/31 完整众筹：6 种新鸟 × 各 4 张 = 96 */
  function buildDeck(extra){
    const d=[]; for(const k of SPECIES_ORDER) for(let i=0;i<COUNT_EACH;i++) d.push(k);
    if(extra==='even'){ for(const k of SPECIES_ORDER) d.push(k); }
    else if(PACKS[extra]){
      for(const sp of PACKS[extra]){ SPECIES[sp.key]=sp; for(let i=0;i<(sp.copies||COUNT_EACH);i++) d.push(sp.key); }
    }
    return d;
  }
  function deckSize(extra){
    if(extra==='even') return COUNT_EACH*SPECIES_ORDER.length+SPECIES_ORDER.length;
    const pack=PACKS[extra];
    return COUNT_EACH*SPECIES_ORDER.length+(pack?pack.reduce((n,x)=>n+(x.copies||COUNT_EACH),0):0);
  }
  function birdLegal(sp, ls){ return SPECIES[sp] && SPECIES[sp].hab.indexOf(ls)>=0; }

  // 群落内禽类计数（跨该群落的所有栖息地）
  function groupCat(gr, cat){ let n=0; for(const h of gr.habs) for(const b of h.birds) if(SPECIES[b].cat===cat) n++; return n; }
  function groupBirds(gr){ let n=0; for(const h of gr.habs) n+=h.birds.length; return n; }
  // 图鉴条件按【单个群落】判定
  function guideMetGroup(g, gr){ for(const c in g.req) if(groupCat(gr,c)<g.req[c]) return false; return true; }
  // 成就：所有群落里已打出的景观合计
  function landCounts(p){ const o={}; for(const gr of p.groups) for(const h of gr.habs) o[h.ls]=(o[h.ls]||0)+1; return o; }
  // 已打出的②级图鉴张数（②级＝需 3 只鸟、最难凑的那一档）
  function playedLv2(p){ let n=0; for(const gr of p.groups) for(const h of gr.habs) if(h.guide&&h.guide.lvl===2) n++; return n; }
  /* achMet(p, a, needLv2)：needLv2>0 时，额外要求「已打出至少 needLv2 张②级图鉴」。
     这是为验算作者 8/17 提的「把难拿的图鉴和成就绑定、好拿的图鉴就不容易拿成就」
     所加的开关；默认 0＝作者原文（只看景观组合）。 */
  function achMet(p, a, needLv2){
    if(needLv2 && playedLv2(p) < needLv2) return false;
    const lc=landCounts(p); for(const L in a.req) if((lc[L]||0)<a.req[L]) return false; return true;
  }
  function allHabs(p){ const o=[]; for(const gr of p.groups) for(const h of gr.habs) o.push(h); return o; }

  /* --------------------------- AI 打法 ----------------------------------- */
  const STYLES = {
    rush:    { key:'rush',    name:'速通',   prefLevel:1 },
    tall:    { key:'tall',    name:'大局',   prefLevel:2 },
    achfirst:{ key:'achfirst',name:'成就流', achFocus:true },
    wide:    { key:'wide',    name:'多群落', wideFocus:true },
    balance: { key:'balance', name:'均衡' },
  };
  const STYLE_ORDER = ['rush','tall','achfirst','wide','balance'];

  /* --------------------------- 建局 -------------------------------------- */
  function newGame(opts){
    opts=opts||{};
    const names=opts.names||['玩家1','玩家2'];
    const cpu=opts.cpu||names.map(()=>true);
    const styles=opts.styles||names.map(()=>'balance');
    const rng=makeRng(opts.seed!=null?opts.seed:12345);
    const st={
      rng, players:[], cur:0,
      extraPack: opts.extraPack||null,       // 众筹解锁包：'stretch' | null
      deck:shuffle(buildDeck(opts.extraPack||null),rng), discard:[], market:[],
      plainPool:{},
      pool1:GUIDES.filter(g=>g.lvl===1).slice(),   // 全部可见的图鉴池（不是展示区）
      pool2:GUIDES.filter(g=>g.lvl===2).slice(),
      achPool:ACH.map(a=>({id:a.id, taken:false})),
      round:1, first:0, turnCount:0,
      phase:'play', obLeft:0, obTaken:false, _collected:false, _built:false,
      ended:false, ender:null, gameOver:false, winner:null, ranking:null,
      // 候选补丁开关（默认全关＝作者原文口径）
      handCap: opts.handCap|0,            // >0：回合结束手牌上限，多余弃入弃牌堆
      deckOutEnd: !!opts.deckOutEnd,      // true：鸟类卡池耗尽时按当前分数结束（防死锁兜底）
      deckOutRounds: opts.deckOutRounds||2, // 需连续几轮「牌池空且无人观鸟」才结束（2 轮实测零误伤）
      winScore: opts.winScore||WIN_SCORE,   // 终局线（默认 15＝作者原文；仅用于数值验算）
      achNeedLv2: opts.achNeedLv2|0,        // 成就额外要求已打出 N 张②级图鉴（默认 0＝作者原文）
      _roundTook: false,                  // 本轮是否有人成功观鸟（兜底判定用）
      _dryRounds: 0,
      log:[],
      stat:{ guideTaken:{}, obMissed:0, kept:0, achTaken:{}, groupsMax:0, discarded:0 },
    };
    for(const L of LAND_ORDER) st.plainPool[L]=PLAIN_COUNT;
    for(let i=0;i<names.length;i++) st.players.push({
      id:i, name:names[i], isCPU:cpu[i]!==false, style:styles[i]||'balance',
      hand:[], plain:[], reserve:[],
      groups:[],        // [{ habs:[{ls,guide,birds}], fillFrom:0 }]
      ach:null,
    });
    for(const p of st.players) for(let i=0;i<6;i++) p.hand.push(st.deck.pop());
    return st;
  }

  function autoDraft(st){
    const N=st.players.length;
    const order=[]; for(let i=0;i<N;i++) order.push(i); for(let i=N-1;i>=0;i--) order.push(i);
    for(const pi of order){
      const p=st.players[pi];
      let best=null,bs=-1e9;
      for(const L of LAND_ORDER){
        if(st.plainPool[L]<=0 || p.plain.indexOf(L)>=0) continue;   // 禁拿两张相同
        let n=0; for(const b of p.hand) if(birdLegal(b,L)) n++;
        const s=n*2+st.rng()*0.3;
        if(s>bs){bs=s;best=L;}
      }
      if(best){ st.plainPool[best]--; p.plain.push(best); }
      let wi=0,ws=1e9;
      for(let i=0;i<p.hand.length;i++){
        const fit=SPECIES[p.hand[i]].hab.filter(L=>p.plain.indexOf(L)>=0).length;
        const s=fit*3+st.rng()*0.2; if(s<ws){ws=s;wi=i;}
      }
      if(p.hand.length) st.discard.push(p.hand.splice(wi,1)[0]);
    }
    for(let i=0;i<5;i++){ const c=drawCard(st); if(c) st.market.push(c); }
    st.phase='play'; st.cur=st.first;
    return st;
  }

  function drawCard(st){
    if(st.deck.length===0){ if(st.discard.length){ st.deck=shuffle(st.discard,st.rng); st.discard=[]; } else return null; }
    return st.deck.pop();
  }
  function refillMarket(st){ while(st.market.length<5){ const c=drawCard(st); if(!c) break; st.market.push(c); } }
  function curPlayer(st){ return st.players[st.cur]; }
  /* 日志：纯展示层，不参与任何规则判定。联机时 hub 会对泄露隐藏信息的行打码。 */
  function lg(st, line){ if(!st.log) st.log=[]; st.log.push(line); if(st.log.length>400) st.log.splice(0, st.log.length-400); }
  function nm(st){ return st.players[st.cur].name; }
  function bn(sp){ return SPECIES[sp] ? SPECIES[sp].name : sp; }

  /* 作者规定每回合先采集、再构建。只有客观上无牌可采/无合法构建时才允许跳过，
     避免牌池耗尽或手牌不匹配时把对局锁死。 */
  function canCollect(st){ return !!(st && st.market && st.market.length); }
  function canBuild(p){
    if(!p) return false;
    for(const b of p.hand){
      if(p.plain.some(L=>birdLegal(b,L)) || p.reserve.some(g=>birdLegal(b,g.ls))) return true;
    }
    for(const gr of p.groups) for(let hi=gr.fillFrom;hi<gr.habs.length;hi++){
      const h=gr.habs[hi];
      if(h.birds.length<SEG_CAP && p.hand.some(b=>birdLegal(b,h.ls))) return true;
    }
    return false;
  }

  /* --------------------------- 采集 -------------------------------------- */
  function collectOne(st, mi){
    if(st.gameOver) return {ok:false,err:'对局已结束'};
    if(st.phase!=='play') return {ok:false,err:'非行动阶段'};
    if(st._collected) return {ok:false,err:'本回合已采集'};
    const p=curPlayer(st);
    if(!Number.isInteger(mi)||mi<0||mi>=st.market.length) return {ok:false,err:'展示区无此牌'};
    const sp=st.market.splice(mi,1)[0];
    p.hand.push(sp); refillMarket(st); st._collected=true;
    lg(st, nm(st)+' 采集了 '+bn(sp)+'。');
    return {ok:true};
  }
  function collectTwo(st, mi1, mi2, handIdx){
    if(st.gameOver) return {ok:false,err:'对局已结束'};
    if(st.phase!=='play') return {ok:false,err:'非行动阶段'};
    if(st._collected) return {ok:false,err:'本回合已采集'};
    const p=curPlayer(st);
    if(![mi1,mi2].every(i=>Number.isInteger(i)&&i>=0&&i<st.market.length)||mi1===mi2) return {ok:false,err:'展示区索引非法'};
    if(!Number.isInteger(handIdx)||handIdx<0||handIdx>=p.hand.length+2) return {ok:false,err:'弃牌索引非法'};
    const hi=[mi1,mi2].sort((a,b)=>b-a);
    const g1=st.market.splice(hi[0],1)[0], g2=st.market.splice(hi[1],1)[0];
    p.hand.push(g1,g2);
    const drop=p.hand.splice(handIdx,1)[0]; st.discard.push(drop);
    refillMarket(st); st._collected=true;
    lg(st, nm(st)+' 采集了 '+bn(g1)+'、'+bn(g2)+'，弃掉 '+bn(drop)+'。');
    return {ok:true};
  }

  /* --------------------------- 构建 --------------------------------------
     打景观：source={plain:'草地'} 或 {reserve:idx}
       groupIdx=null → 新建一个群落；否则给该群落加第 2 个栖息地 */
  function buildHabitat(st, source, handIdx, groupIdx){
    if(st.gameOver) return {ok:false,err:'对局已结束'};
    if(st.phase!=='play') return {ok:false,err:'非行动阶段'};
    if(!st._collected && canCollect(st)) return {ok:false,err:'请先完成采集，再进行构建'};
    if(st._built) return {ok:false,err:'本回合已构建'};
    const p=curPlayer(st);
    let ls=null, guide=null;
    if(source && typeof source.plain==='string'){
      if(p.plain.indexOf(source.plain)<0) return {ok:false,err:'你没有这张普通景观'};
      ls=source.plain;
    } else if(source && Number.isInteger(source.reserve)){
      if(source.reserve<0||source.reserve>=p.reserve.length) return {ok:false,err:'储备区无此图鉴'};
      guide=p.reserve[source.reserve]; ls=guide.ls;
    } else return {ok:false,err:'来源非法'};
    if(!Number.isInteger(handIdx)||handIdx<0||handIdx>=p.hand.length) return {ok:false,err:'手牌索引非法'};
    if(!birdLegal(p.hand[handIdx], ls)) return {ok:false,err:'该鸟不能放入此景观'};

    let gr=null;
    if(groupIdx==null){                       // 新建群落
      gr={ habs:[], fillFrom:0 }; p.groups.push(gr);
    } else {
      if(!Number.isInteger(groupIdx)||groupIdx<0||groupIdx>=p.groups.length) return {ok:false,err:'群落非法'};
      gr=p.groups[groupIdx];
      if(gr.habs.length>=HAB_CAP) return {ok:false,err:'一个群落最多 '+HAB_CAP+' 个栖息地'};
      if(gr.habs[gr.habs.length-1].birds.length===0) return {ok:false,err:'上一个栖息地还没有鸟'};
    }
    if(guide) p.reserve.splice(source.reserve,1); else p.plain.splice(p.plain.indexOf(ls),1);
    const first=p.hand.splice(handIdx,1)[0];
    gr.habs.push({ ls, guide, birds:[first] });
    lg(st, nm(st)+' 在'+(groupIdx==null?'新群落':'群落'+(groupIdx+1))+'打出'
      +(guide?('图鉴景观【'+guide.name+'】'):('景观【'+ls+'】'))+'，并放入 '+bn(first)+'。');
    gr.fillFrom = gr.habs.length-1;           // 开建新栖息地 → 左侧封闭
    st._built=true;
    if(p.groups.length>st.stat.groupsMax) st.stat.groupsMax=p.groups.length;
    return {ok:true, group:p.groups.indexOf(gr), hab:gr.habs.length-1};
  }
  // 往某群落的某栖息地放 1-2 只鸟
  function buildBirds(st, groupIdx, habIdx, handIdxs){
    if(st.gameOver) return {ok:false,err:'对局已结束'};
    if(st.phase!=='play') return {ok:false,err:'非行动阶段'};
    if(!st._collected && canCollect(st)) return {ok:false,err:'请先完成采集，再进行构建'};
    if(st._built) return {ok:false,err:'本回合已构建'};
    const p=curPlayer(st);
    if(!Number.isInteger(groupIdx)||groupIdx<0||groupIdx>=p.groups.length) return {ok:false,err:'群落非法'};
    const gr=p.groups[groupIdx];
    if(!Number.isInteger(habIdx)||habIdx<0||habIdx>=gr.habs.length) return {ok:false,err:'栖息地非法'};
    if(habIdx<gr.fillFrom) return {ok:false,err:'该群落已开建右侧，不能回头'};
    if(!Array.isArray(handIdxs)||handIdxs.length<1||handIdxs.length>2) return {ok:false,err:'一次放 1–2 只'};
    const seen=new Set();
    for(const i of handIdxs){ if(!Number.isInteger(i)||i<0||i>=p.hand.length||seen.has(i)) return {ok:false,err:'手牌索引非法'}; seen.add(i); }
    const h=gr.habs[habIdx];
    if(h.birds.length+handIdxs.length>SEG_CAP) return {ok:false,err:'每栖息地最多 '+SEG_CAP+' 鸟'};
    for(const i of handIdxs) if(!birdLegal(p.hand[i],h.ls)) return {ok:false,err:'鸟与景观不符'};
    const sp=handIdxs.map(i=>p.hand[i]);
    handIdxs.slice().sort((a,b)=>b-a).forEach(i=>p.hand.splice(i,1));
    for(const x of sp) h.birds.push(x);
    gr.fillFrom=habIdx;
    st._built=true;
    lg(st, nm(st)+' 在群落'+(groupIdx+1)+'的【'+h.ls+'】放入 '+sp.map(bn).join('、')+'。');
    return {ok:true};
  }

  function endTurn(st){
    if(st.gameOver) return {ok:false,err:'对局已结束'};
    if(st.phase!=='play') return {ok:false,err:'非行动阶段'};
    if(!st._collected && canCollect(st)) return {ok:false,err:'本回合还没有采集'};
    if(!st._built && canBuild(curPlayer(st))) return {ok:false,err:'本回合还没有构建'};
    // 候选补丁 A：手牌上限——回合结束弃到上限（弃入弃牌堆，可再洗回牌堆）
    if(st.handCap>0){
      const p=curPlayer(st);
      while(p.hand.length>st.handCap){
        let wi=0,ws=1e9;
        for(let i=0;i<p.hand.length;i++){
          const s=SPECIES[p.hand[i]].hab.filter(L=>allHabs(p).some(h=>h.ls===L)||p.plain.indexOf(L)>=0).length+st.rng()*0.1;
          if(s<ws){ws=s;wi=i;}
        }
        st.discard.push(p.hand.splice(wi,1)[0]); st.stat.discarded++;
      }
    }
    st.turnCount++; st._collected=false; st._built=false;
    const nxt=(st.cur+1)%st.players.length;
    if(nxt===st.first){ st.phase='observe'; st.cur=st.first; st.obLeft=st.players.length; st.obTaken=false; st._roundTook=false; }
    else st.cur=nxt;
    refillMarket(st);   // 展示区随时补满：归还到弃牌堆的鸟应能重新进入展示区
    return {ok:true};
  }

  /* --------------------------- 观鸟 -------------------------------------- */
  // 列出「某群落 × 某图鉴」的所有可行组合
  function observableOptions(st, p){
    const out=[];
    p.groups.forEach((gr,gi)=>{
      st.pool1.forEach((g,i)=>{ if(guideMetGroup(g,gr)) out.push({group:gi, lvl:1, idx:i, g}); });
      st.pool2.forEach((g,i)=>{ if(guideMetGroup(g,gr)) out.push({group:gi, lvl:2, idx:i, g}); });
    });
    return out;
  }
  function keepQuota(p, newGuide){
    const quota={};
    if(newGuide) quota[newGuide.keep]=(quota[newGuide.keep]||0)+1;
    for(const gr of p.groups) for(const h of gr.habs) if(h.guide) quota[h.guide.keep]=(quota[h.guide.keep]||0)+1;
    return quota;
  }
  // 旧录像/电脑的确定性默认选择；真人界面会显式传 keepChoices，让玩家自己选鸟和去向。
  function autoKeepChoices(p, gr, newGuide){
    const quota=keepQuota(p,newGuide), out=[];
    gr.habs.forEach((h,hi)=>h.birds.forEach((b,bi)=>{
      const c=SPECIES[b].cat;
      if(quota[c]>0){ quota[c]--; out.push({hab:hi,bird:bi,toHand:hi>0}); }
    }));
    return out;
  }
  // 观鸟：对 groupIdx 群落拿取一张达成的图鉴 → 归还该群落的鸟（按玩家选择保留）
  function obTake(st, groupIdx, lvl, idx, keepChoices){
    if(st.gameOver) return {ok:false,err:'对局已结束'};
    if(st.phase!=='observe') return {ok:false,err:'非观鸟阶段'};
    if(st.obTaken) return {ok:false,err:'本轮已观鸟'};
    const p=curPlayer(st);
    if(!Number.isInteger(groupIdx)||groupIdx<0||groupIdx>=p.groups.length) return {ok:false,err:'群落非法'};
    const gr=p.groups[groupIdx];
    const pool = lvl===1?st.pool1:st.pool2;
    if(!Number.isInteger(idx)||idx<0||idx>=pool.length) return {ok:false,err:'图鉴池无此卡'};
    const g=pool[idx];
    if(!guideMetGroup(g,gr)) return {ok:false,err:'该群落未达成此图鉴条件'};

    const choices = keepChoices==null ? autoKeepChoices(p,gr,g) : keepChoices;
    if(!Array.isArray(choices)) return {ok:false,err:'保留鸟选择非法'};
    const quota=keepQuota(p,g), picked=new Map();
    for(const x of choices){
      if(!x || !Number.isInteger(x.hab) || !Number.isInteger(x.bird)
        || x.hab<0 || x.hab>=gr.habs.length || x.bird<0 || x.bird>=gr.habs[x.hab].birds.length)
        return {ok:false,err:'保留鸟位置非法'};
      const key=x.hab+':'+x.bird;
      if(picked.has(key)) return {ok:false,err:'同一只鸟不能重复保留'};
      const c=SPECIES[gr.habs[x.hab].birds[x.bird]].cat;
      if(!quota[c]) return {ok:false,err:'超过了 '+c+' 的保留名额'};
      if(x.hab>0 && !x.toHand) return {ok:false,err:'第二个栖息地的保留鸟必须收回手牌'};
      quota[c]--; picked.set(key,{toHand:!!x.toHand});
    }

    pool.splice(idx,1); p.reserve.push(g);
    st.stat.guideTaken[g.id]=(st.stat.guideTaken[g.id]||0)+1;
    st.obTaken=true; st._roundTook=true;
    lg(st, nm(st)+' 对群落'+(groupIdx+1)+'观鸟成功，拿取图鉴【'+g.name+'】到储备区。');

    let kept=0, returned=0, toHand=0;
    gr.habs.forEach((h,hi)=>{
      const stay=[];
      h.birds.forEach((b,bi)=>{
        const pick=picked.get(hi+':'+bi);
        if(pick){
          kept++;
          if(hi>0 || pick.toHand){ p.hand.push(b); toHand++; }
          else stay.push(b);
        } else { st.discard.push(b); returned++; }
      });
      h.birds=stay;
    });
    gr.fillFrom=0;
    st.stat.kept+=kept;
    lg(st, '　群落'+(groupIdx+1)+'：归还 '+returned+' 只，保留 '+kept+' 只'
      +(toHand?('（其中 '+toHand+' 只在第二个栖息地，收回手牌）'):'')+'。');
    return {ok:true, kept, returned, toHand};
  }
  function obTakeAch(st, achId){
    if(st.gameOver) return {ok:false,err:'对局已结束'};
    if(st.phase!=='observe') return {ok:false,err:'非观鸟阶段'};
    const p=curPlayer(st);
    if(p.ach!=null) return {ok:false,err:'每人全局限拿 1 张成就'};
    const slot=st.achPool.find(x=>x.id===achId && !x.taken);
    if(!slot) return {ok:false,err:'该成就已被拿走'};
    const a=ACH.find(x=>x.id===achId);
    if(!achMet(p,a,st.achNeedLv2)) return {ok:false,err:'未达成该成就条件'};
    slot.taken=true; p.ach=achId;
    st.stat.achTaken[achId]=(st.stat.achTaken[achId]||0)+1;
    lg(st, nm(st)+' 达成 '+a.name+'。');
    return {ok:true};
  }
  function obFinish(st, declare){
    if(st.gameOver) return {ok:false,err:'对局已结束'};
    if(st.phase!=='observe') return {ok:false,err:'非观鸟阶段'};
    const pi=st.cur;
    if(!st.obTaken){ st.stat.obMissed++; lg(st, st.players[pi].name+' 本轮观鸟没能达成任何图鉴。'); }
    if(declare && currentScore(st,pi)>=st.winScore && !st.ended){ st.ended=true; st.ender=pi;
      lg(st, '★ '+st.players[pi].name+' 宣布终局（当前 '+currentScore(st,pi)+' 分）——本轮观鸟走完后结算。'); }
    st.obLeft--; st.obTaken=false;
    if(st.obLeft<=0){
      if(st.ended){ st.gameOver=true; finalize(st); lg(st, '=== 游戏结束 ==='); return {ok:true}; }
      st.first=(st.first+1)%st.players.length;
      st.round++; st.phase='play'; st.cur=st.first;
      refillMarket(st);   // 观鸟归还的鸟进入弃牌堆后，新一轮开始前把展示区补满
      lg(st, '—— 第 '+st.round+' 轮 ——');
      /* 候选补丁 B：防死锁兜底。判定必须放在【一整轮观鸟走完之后】——
         观鸟归还的鸟要到这时才进弃牌堆，若在观鸟前判定，会把「瞬时归零又回血」
         的健康对局误判成终局（实测误伤 0.028%，甚至改变冠军归属）。
         再加「且本轮无人成功观鸟」一条，把误伤压到 0。 */
      if(st.deckOutEnd){
        const dry = !st._roundTook && st.deck.length+st.discard.length+st.market.length===0;
        st._dryRounds = dry ? st._dryRounds+1 : 0;
        if(st._dryRounds>=st.deckOutRounds){
          lg(st, '⚠ 鸟类牌堆、弃牌堆与展示区皆空，且连续 '+st.deckOutRounds+' 轮无人观鸟成功 → 按当前分数结束。');
          st.gameOver=true; st.ended=true; if(st.ender==null) st.ender=-1; finalize(st);
        }
      }
    } else st.cur=(st.cur+1)%st.players.length;
    return {ok:true};
  }

  /* --------------------------- 计分 -------------------------------------- */
  function guidePoints(p){ let s=0; for(const gr of p.groups) for(const h of gr.habs) if(h.guide) s+=h.guide.pts; return s; }
  function achPoints(p){ if(p.ach==null) return 0; const a=ACH.find(x=>x.id===p.ach); return a?a.pts:0; }
  function currentScore(st,pi){ const p=st.players[pi]; return guidePoints(p)+achPoints(p); }
  function finalScore(st,pi){ const p=st.players[pi]; return currentScore(st,pi)-p.reserve.length; }
  function finalize(st){
    const rank=st.players.map((p,i)=>({ i, name:p.name, style:p.style, score:finalScore(st,i),
      guides:guidePoints(p), ach:achPoints(p), reserve:p.reserve.length,
      nPlayed:allHabs(p).filter(h=>h.guide).length, nGroups:p.groups.length }));
    rank.sort((a,b)=>b.score-a.score||b.ach-a.ach||b.guides-a.guides);
    st.ranking=rank; st.winner=rank[0];
  }

  /* --------------------------- AI ---------------------------------------- */
  function guideDesire(st,p,g,gr){
    const style=STYLES[p.style]||STYLES.balance;
    let d=g.pts;
    if(style.prefLevel===g.lvl) d+=1.5;
    let gap=0; for(const c in g.req) gap+=Math.max(0,g.req[c]-(gr?groupCat(gr,c):0));
    d-=gap*1.3;
    if(style.achFocus && p.ach==null){
      const lc=landCounts(p);
      for(const a of ACH){ const slot=st.achPool.find(x=>x.id===a.id&&!x.taken); if(!slot) continue;
        if(a.req[g.ls] && (lc[g.ls]||0)<a.req[g.ls]){ d+=1.5; break; } }
    }
    return d;
  }
  // 当前最想凑的图鉴（针对某群落）
  function targetFor(st,p,gr){
    let best=null,bd=-1e9;
    for(const pool of [st.pool1,st.pool2]) for(const g of pool){ const d=guideDesire(st,p,g,gr); if(d>bd){bd=d;best=g;} }
    return best;
  }
  // 给定一个群落的禽类构成，估它「离最好的一张图鉴还有多远」
  function bestGroupValue(st, catCounts){
    let best=-1e9;
    for(const pool of [st.pool1,st.pool2]) for(const g of pool){
      let gap=0; for(const c in g.req) gap+=Math.max(0,g.req[c]-(catCounts[c]||0));
      const v=g.pts-gap*1.3; if(v>best) best=v;
    }
    return best===-1e9?0:best;
  }
  function birdHelp(g,sp,gr){
    if(!g) return 0.2;
    const c=SPECIES[sp].cat;
    if(g.req[c] && (gr?groupCat(gr,c):0)<g.req[c]) return 3;
    if(g.req[c]) return 0.6;
    return 0.15;
  }
  function cpuAction(st){
    const p=curPlayer(st);
    const style=STYLES[p.style]||STYLES.balance;
    // 以"最有希望的群落"为主攻对象
    let focus=null, focusIdx=null, ft=null, fd=-1e9;
    p.groups.forEach((gr,gi)=>{ const t=targetFor(st,p,gr); const d=t?guideDesire(st,p,t,gr):-9;
      if(d>fd){ fd=d; focus=gr; focusIdx=gi; ft=t; } });
    const target = ft || targetFor(st,p,null);

    /* 采集 */
    if(st.market.length){
      let bi=0,bs=-1e9;
      for(let i=0;i<st.market.length;i++){
        const b=st.market[i];
        let s=birdHelp(target,b,focus);
        const canHost = p.groups.some(gr=>gr.habs.some((h,hi)=>hi>=gr.fillFrom && h.birds.length<SEG_CAP && birdLegal(b,h.ls)))
                     || p.plain.some(L=>birdLegal(b,L)) || p.reserve.some(gg=>birdLegal(b,gg.ls));
        if(canHost) s+=1.2;
        s+=st.rng()*0.25;
        if(s>bs){bs=s;bi=i;}
      }
      if(p.hand.length>=6 && st.market.length>=2){
        let bj=-1,bs2=-1e9;
        for(let i=0;i<st.market.length;i++){ if(i===bi)continue; const s=birdHelp(target,st.market[i],focus); if(s>bs2){bs2=s;bj=i;} }
        let wi=0,ws=1e9;
        for(let i=0;i<p.hand.length;i++){ const s=birdHelp(target,p.hand[i],focus); if(s<ws){ws=s;wi=i;} }
        if(bj>=0) collectTwo(st,bi,bj,wi); else collectOne(st,bi);
      } else collectOne(st,bi);
    }

    /* 构建：① 优先打储备图鉴（计分 + 免终局扣分） */
    // 枚举「新建群落 / 扩建某群落」两类落点，各自打分（不再硬编码打法）
    function siteOptions(st,p,ls,sp,style){
      const out=[{ tg:null, val:bestGroupValue(st,{ [SPECIES[sp].cat]:1 }) + (style.wideFocus?0.9:0) }];
      p.groups.forEach((gr,gi)=>{
        if(gr.habs.length>=HAB_CAP) return;
        if(gr.habs[gr.habs.length-1].birds.length===0) return;
        const cc={}; for(const c of CATS) cc[c]=groupCat(gr,c);
        cc[SPECIES[sp].cat]=(cc[SPECIES[sp].cat]||0)+1;
        out.push({ tg:gi, val:bestGroupValue(st,cc) + (style.wideFocus?0:0.5) });
      });
      out.sort((a,b)=>b.val-a.val);
      return out[0];
    }
    let built=false;
    if(p.reserve.length){
      let best=null,bs=-1e9;
      for(let ri=0;ri<p.reserve.length;ri++){
        const g=p.reserve[ri];
        for(let hi=0;hi<p.hand.length;hi++){
          if(!birdLegal(p.hand[hi],g.ls)) continue;
          const site=siteOptions(st,p,g.ls,p.hand[hi],style);
          const s=g.pts + birdHelp(target,p.hand[hi],focus)*0.3 + p.reserve.length*0.5 + site.val*0.6;
          if(s>bs){bs=s;best={ri,hi,tg:site.tg};}
        }
      }
      if(best) built=buildHabitat(st,{reserve:best.ri},best.hi,best.tg).ok;
    }
    /* ② 往现有栖息地放鸟推进目标 */
    if(!built){
      const cand=[];
      p.groups.forEach((gr,gi)=>{
        const t=targetFor(st,p,gr);
        gr.habs.forEach((h,hi)=>{
          if(hi<gr.fillFrom || h.birds.length>=SEG_CAP) return;
          for(let k=0;k<p.hand.length;k++) if(birdLegal(p.hand[k],h.ls))
            cand.push({gi,hi,k,score:birdHelp(t,p.hand[k],gr)+(gi===focusIdx?0.5:0)});
        });
      });
      cand.sort((a,b)=>b.score-a.score);
      if(cand.length){
        const pick=cand[0], idxs=[pick.k];
        const h=p.groups[pick.gi].habs[pick.hi];
        if(SEG_CAP-h.birds.length>=2){
          const second=cand.find(c=>c.gi===pick.gi&&c.hi===pick.hi&&c.k!==pick.k);
          if(second) idxs.push(second.k);
        }
        built=buildBirds(st,pick.gi,pick.hi,idxs).ok;
      }
    }
    /* ③ 打普通景观 */
    if(!built && p.plain.length){
      let best=null,bs=-1e9;
      for(const L of p.plain){
        for(let hi=0;hi<p.hand.length;hi++){
          if(!birdLegal(p.hand[hi],L)) continue;
          const site=siteOptions(st,p,L,p.hand[hi],style);
          const s=birdHelp(target,p.hand[hi],focus)+0.5+site.val*0.6;
          if(s>bs){bs=s;best={L,hi,tg:site.tg};}
        }
      }
      if(best) built=buildHabitat(st,{plain:best.L},best.hi,best.tg).ok;
    }
    endTurn(st);
  }
  function cpuObserve(st){
    const p=curPlayer(st);
    const opts=observableOptions(st,p);
    if(opts.length){
      /* 平手必须随机打破，不能按池内顺序取前者。
         v5 的图鉴条件按【整个群落】判定、与卡面印的景观无关，所以存在「拿取条件与分数
         完全相同」的成对图鉴（如 ②1 树冠·猛2攀1 与 ②10 草地·猛2攀1）。稳定排序会让
         索引在前的那张永远被选中，从而在统计里伪造出巨大的冷热差——那是量具的假象，
         不是游戏的性质。给每个选项加一点随机抖动即可消除。 */
      const jit=new Map();
      for(const o of opts) jit.set(o, st.rng()*1e-6);
      opts.sort((a,b)=>(guideDesire(st,p,b.g,p.groups[b.group])+jit.get(b))
                      -(guideDesire(st,p,a.g,p.groups[a.group])+jit.get(a)));
      const pick=opts[0];
      obTake(st,pick.group,pick.lvl,pick.idx);
    }
    if(p.ach==null){
      let best=null;
      for(const a of ACH){
        const slot=st.achPool.find(x=>x.id===a.id&&!x.taken); if(!slot) continue;
        if(achMet(p,a,st.achNeedLv2)){ if(!best||a.pts>best.pts) best=a; }
      }
      if(best) obTakeAch(st,best.id);
    }
    obFinish(st, currentScore(st,st.cur)>=st.winScore);
  }
  function cpuStep(st){ if(st.gameOver) return false; if(st.phase==='play') cpuAction(st); else cpuObserve(st); return true; }
  /* cpuTurn：走完当前行动者的一整"步"（行动回合含 endTurn，或一个观鸟步含 obFinish）。
     供联机 hub 托管电脑座位用——与 cpuStep 语义相同，另起名字是为了和 v2 的 hub 接口对齐。 */
  function cpuTurn(st){ return cpuStep(st); }

  return {
    SPECIES, SPECIES_ORDER, CATS, LAND_ORDER, PLAIN_COUNT, COUNT_EACH,
    GUIDES, GUIDE_BY_ID, ACH, STYLES, STYLE_ORDER, WIN_SCORE, SEG_CAP, HAB_CAP, PACKS,
    makeRng, shuffle, buildDeck, deckSize, newGame, autoDraft, drawCard, refillMarket, curPlayer,
    canCollect, canBuild,
    collectOne, collectTwo, buildHabitat, buildBirds, endTurn,
    birdLegal, groupCat, groupBirds, guideMetGroup, landCounts, achMet, allHabs,
    observableOptions, keepQuota, autoKeepChoices, obTake, obTakeAch, obFinish,
    guidePoints, achPoints, currentScore, finalScore, finalize, playedLv2,
    cpuStep, cpuTurn, cpuAction, cpuObserve, targetFor, lg,
  };
});

</script>
<script>
/* =============================================================================
   观鸟俱乐部 v6（8/31 最新稿）网页界面 · 清晨湖畔润色版
   规则全部来自 src/game-core-v6-live.js —— 界面【只做展示与动作发送】，绝不自行判定规则。
   ========================================================================== */
const G = (typeof BirdGameV6Live!=='undefined')?BirdGameV6Live:window.BirdGameV6Live;
const S=G.SPECIES, LO=G.LAND_ORDER;
const CPU_DELAY=650;

/* ===================== 🎵 班得瑞风「清晨湖畔」零依赖 Web Audio 引擎 ===================== */
const BGM=(function(){
  const KEY='birding-songjiang.sound.v1';
  let mode='full'; // 'full' | 'nature' | 'off'
  try{ const saved=localStorage.getItem(KEY); if(saved==='full'||saved==='nature'||saved==='off') mode=saved; }catch(e){}
  let ac=null, master=null, musicGain=null, natureGain=null, sfxGain=null, echoIn=null, reverbIn=null;
  let started=false, timer=null, step=0, nextTime=0, nextBirdTime=0, noiseNode=null;

  const STEP=0.45; // ~67 BPM 八分音符
  const CHORDS=[
    [53,60,64,69],[52,60,67,72],[50,57,65,69],[45,52,60,67],
    [46,53,62,69],[45,53,60,69],[43,50,58,65],[48,55,60,64],
    [53,60,64,69],[52,60,67,72],[50,57,64,69],[45,52,60,67],
    [46,53,62,69],[43,50,58,65],[48,55,62,65],[53,60,64,69]
  ];
  const ARP=[0,1,2,3,2,1,2,3];
  // 16小节舒缓排箫/陶笛旋律（F大调五声音阶抒情乐句，留白充足）
  const MEL={
    0:{0:[81,3],3:[79,1],4:[77,4]}, 1:{0:[79,2],2:[81,2],4:[84,4]},
    2:{0:[86,3],3:[84,1],4:[81,4]}, 3:{},
    4:{0:[82,2],2:[81,2],4:[79,2],6:[77,2]}, 5:{0:[81,3],3:[79,1],4:[77,4]},
    6:{0:[74,2],2:[77,2],4:[79,4]}, 7:{0:[79,6]},
    8:{0:[84,3],3:[81,1],4:[79,2],6:[77,2]}, 9:{0:[79,2],2:[84,2],4:[88,4]},
    10:{0:[86,3],3:[84,1],4:[81,4]}, 11:{0:[79,2],2:[76,2],4:[79,4]},
    12:{0:[86,2],2:[84,2],4:[82,2],6:[81,2]}, 13:{0:[79,3],3:[77,1],4:[74,4]},
    14:{0:[77,2],2:[79,2],4:[81,2],6:[79,2]}, 15:{0:[77,7]}
  };
  function m2f(m){ return 440*Math.pow(2,(m-69)/12); }

  function ensure(){
    if(ac) return ac;
    const C=window.AudioContext||window.webkitAudioContext;
    if(!C) return null;
    try{
      ac=new C();
      const comp=ac.createDynamicsCompressor();
      comp.threshold.value=-15; comp.knee.value=24; comp.ratio.value=3.5; comp.attack.value=0.015; comp.release.value=0.25;
      const warmth=ac.createBiquadFilter(); warmth.type='lowpass'; warmth.frequency.value=4800; warmth.Q.value=0.5;
      master=ac.createGain(); master.gain.value=0.0001;
      master.connect(warmth); warmth.connect(comp); comp.connect(ac.destination);

      musicGain=ac.createGain(); musicGain.gain.value=(mode==='full'?1:0.0001); musicGain.connect(master);
      natureGain=ac.createGain(); natureGain.gain.value=(mode==='off'?0.0001:1); natureGain.connect(master);
      sfxGain=ac.createGain(); sfxGain.gain.value=(mode==='off'?0.0001:0.9); sfxGain.connect(master);

      // 湖面回声延迟
      const dl=ac.createDelay(1.0); dl.delayTime.value=0.38;
      const dlLp=ac.createBiquadFilter(); dlLp.type='lowpass'; dlLp.frequency.value=950;
      const dlFb=ac.createGain(); dlFb.gain.value=0.24;
      const dlOut=ac.createGain(); dlOut.gain.value=0.34;
      echoIn=ac.createGain();
      echoIn.connect(dl); dl.connect(dlLp); dlLp.connect(dlFb); dlFb.connect(dl); dlLp.connect(dlOut); dlOut.connect(master);

      // 程序生成 1.9s 清晨湖泊混响冲激响应
      reverbIn=ac.createGain();
      try{
        const len=Math.floor(ac.sampleRate*1.9), ir=ac.createBuffer(2,len,ac.sampleRate);
        for(let ch=0;ch<2;ch++){
          const d=ir.getChannelData(ch); let lp=0;
          for(let i=0;i<len;i++){
            const env=Math.min(1,i/(ac.sampleRate*0.03))*Math.pow(1-i/len,2.6);
            const wn=(Math.random()*2-1)*env; lp=lp*0.72+wn*0.28; d[i]=lp;
          }
        }
        const conv=ac.createConvolver(); conv.buffer=ir;
        const revWet=ac.createGain(); revWet.gain.value=0.28;
        reverbIn.connect(conv); conv.connect(revWet); revWet.connect(master);
      }catch(e){ reverbIn.connect(echoIn); }

      startLakeAmbience();
    }catch(e){ ac=null; }
    return ac;
  }

  function startLakeAmbience(){
    if(!ac || noiseNode) return;
    try{
      const len=ac.sampleRate*5, buf=ac.createBuffer(1,len,ac.sampleRate), d=buf.getChannelData(0);
      let b0=0,b1=0,b2=0;
      for(let i=0;i<len;i++){
        const w=Math.random()*2-1;
        b0=0.997*b0+w*0.029; b1=0.985*b1+w*0.032; b2=0.950*b2+w*0.048;
        const fade=Math.min(1,i/1200, (len-i)/1200);
        d[i]=(b0+b1+b2)*0.16*fade;
      }
      const src=ac.createBufferSource(); src.buffer=buf; src.loop=true;
      const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=320; lp.Q.value=0.6;
      const lfo=ac.createOscillator(), lfoG=ac.createGain();
      lfo.frequency.value=0.12; lfoG.gain.value=140; lfo.connect(lfoG); lfoG.connect(lp.frequency);
      const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1050; bp.Q.value=1.1;
      const bpG=ac.createGain(); bpG.gain.value=0.14;
      const g=ac.createGain(); g.gain.value=0.055;
      src.connect(lp); lp.connect(g);
      src.connect(bp); bp.connect(bpG); bpG.connect(g);
      g.connect(natureGain);
      src.start(); lfo.start(); noiseNode=src;
    }catch(e){}
  }

  function route(node, wet, bus){
    node.connect(bus);
    if(echoIn && wet>0){ const wg=ac.createGain(); wg.gain.value=wet; node.connect(wg); wg.connect(echoIn); }
    if(reverbIn && wet>0){ const rg=ac.createGain(); rg.gain.value=wet*1.1; node.connect(rg); rg.connect(reverbIn); }
  }

  function playHarp(midi, t, dur, vel){
    const o1=ac.createOscillator(), o2=ac.createOscillator(), flt=ac.createBiquadFilter(), g=ac.createGain();
    const f=m2f(midi);
    o1.type='sine'; o1.frequency.setValueAtTime(f,t);
    o2.type='triangle'; o2.frequency.setValueAtTime(f*2,t);
    const g2=ac.createGain(); g2.gain.value=0.18;
    flt.type='lowpass'; flt.frequency.setValueAtTime(2100,t); flt.frequency.exponentialRampToValueAtTime(480,t+0.55);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(0.055*vel,t+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o1.connect(flt); o2.connect(g2); g2.connect(flt); flt.connect(g);
    route(g,0.34,musicGain);
    o1.start(t); o2.start(t); o1.stop(t+dur+0.05); o2.stop(t+dur+0.05);
  }

  function playPad(midis, t, dur){
    midis.slice(0,3).forEach((m,idx)=>{
      const o=ac.createOscillator(), flt=ac.createBiquadFilter(), g=ac.createGain();
      o.type=idx===0?'triangle':'sine'; o.frequency.setValueAtTime(m2f(m)*(idx===1?1.0015:0.9988),t);
      flt.type='lowpass'; flt.frequency.value=420;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.linearRampToValueAtTime(0.017,t+1.25);
      g.gain.setValueAtTime(0.017,t+dur-1.1);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur+0.2);
      o.connect(flt); flt.connect(g); g.connect(musicGain);
      o.start(t); o.stop(t+dur+0.25);
    });
  }

  function playFlute(midi, t, dur){
    const o=ac.createOscillator(), o2=ac.createOscillator(), vib=ac.createOscillator(), vibG=ac.createGain(), g=ac.createGain();
    const f=m2f(midi);
    o.type='sine'; o.frequency.setValueAtTime(f,t);
    o2.type='triangle'; o2.frequency.setValueAtTime(f*2,t);
    const g2=ac.createGain(); g2.gain.value=0.07;
    vib.frequency.value=5.1;
    vibG.gain.setValueAtTime(0.001,t); vibG.gain.linearRampToValueAtTime(3.2,t+0.35);
    vib.connect(vibG); vibG.connect(o.frequency);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(0.044,t+0.13);
    g.gain.setValueAtTime(0.040,t+Math.max(0.18,dur-0.24));
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur+0.18);
    o.connect(g); o2.connect(g2); g2.connect(g);
    route(g,0.45,musicGain);
    o.start(t); o2.start(t); vib.start(t);
    o.stop(t+dur+0.24); o2.stop(t+dur+0.24); vib.stop(t+dur+0.24);
  }

  function chirpBird(t, kind, vol){
    if(!ac || mode==='off') return;
    t=t||ac.currentTime+0.02; vol=(vol==null?1:vol);
    kind=(kind==null?Math.floor(Math.random()*4):kind);
    const dest=natureGain;
    let out=ac.createGain(); out.gain.value=vol;
    if(ac.createStereoPanner){
      const pan=ac.createStereoPanner(); pan.pan.value=(Math.random()*1.2-0.6);
      out.connect(pan); route(pan,0.55,dest);
    } else route(out,0.55,dest);

    if(kind===0){ // 清脆水鸲双啁啾
      [0,0.14].forEach((dt,k)=>{
        const o=ac.createOscillator(), g=ac.createGain(), s=t+dt;
        o.type='sine'; o.frequency.setValueAtTime(2200+k*260,s); o.frequency.exponentialRampToValueAtTime(3350+k*320,s+0.075);
        g.gain.setValueAtTime(0.0001,s); g.gain.linearRampToValueAtTime(0.028,s+0.012); g.gain.exponentialRampToValueAtTime(0.0001,s+0.095);
        o.connect(g); g.connect(out); o.start(s); o.stop(s+0.11);
      });
    } else if(kind===1){ // 湖畔黄鹂婉转啼鸣
      const o=ac.createOscillator(), vib=ac.createOscillator(), vg=ac.createGain(), g=ac.createGain();
      o.type='sine'; o.frequency.setValueAtTime(1750,t); o.frequency.linearRampToValueAtTime(2350,t+0.09);
      o.frequency.linearRampToValueAtTime(1550,t+0.19); o.frequency.linearRampToValueAtTime(2150,t+0.29);
      vib.frequency.value=18; vg.gain.value=85; vib.connect(vg); vg.connect(o.frequency);
      g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.024,t+0.03); g.gain.exponentialRampToValueAtTime(0.0001,t+0.34);
      o.connect(g); g.connect(out); o.start(t); vib.start(t); o.stop(t+0.36); vib.stop(t+0.36);
    } else if(kind===2){ // 林间翠鸟三连音
      [0,0.095,0.19].forEach((dt,k)=>{
        const o=ac.createOscillator(), g=ac.createGain(), s=t+dt;
        const f=[2950,3320,2760][k];
        o.type='sine'; o.frequency.setValueAtTime(f,s); o.frequency.exponentialRampToValueAtTime(f*1.12,s+0.055);
        g.gain.setValueAtTime(0.0001,s); g.gain.linearRampToValueAtTime(0.022,s+0.008); g.gain.exponentialRampToValueAtTime(0.0001,s+0.07);
        o.connect(g); g.connect(out); o.start(s); o.stop(s+0.085);
      });
    } else { // 远岸斑鸠轻啼
      [0,0.28].forEach((dt,k)=>{
        const o=ac.createOscillator(), g=ac.createGain(), s=t+dt;
        o.type='sine'; o.frequency.setValueAtTime(k?523:622,s); o.frequency.exponentialRampToValueAtTime(k?440:523,s+0.20);
        g.gain.setValueAtTime(0.0001,s); g.gain.linearRampToValueAtTime(0.024,s+0.04); g.gain.exponentialRampToValueAtTime(0.0001,s+0.24);
        o.connect(g); g.connect(out); o.start(s); o.stop(s+0.26);
      });
    }
  }

  function schedule(){
    if(!ac || mode==='off') return;
    const now=ac.currentTime;
    if(mode==='full'){
      while(nextTime < now+0.28){
        const bar=Math.floor(step/8)%16, beat=step%8, ch=CHORDS[bar];
        if(beat===0) playPad(ch, nextTime, STEP*8);
        if(!(beat===7 && (bar===3||bar===7||bar===15))){
          const n=ch[ARP[beat]%ch.length];
          const vel=(beat===0?0.95:(beat===4?0.82:0.64));
          playHarp(n, nextTime, STEP*3.8, vel);
          if(beat===0 && bar%2===0) playHarp(ch[0]-12, nextTime, STEP*4.5, 0.72);
        }
        const m=(MEL[bar]||{})[beat];
        if(m) playFlute(m[0], nextTime+0.02, STEP*m[1]);
        step=(step+1)%128; nextTime+=STEP;
      }
    } else {
      nextTime=now+0.05;
    }
    if(now >= nextBirdTime){
      chirpBird(now+0.08);
      nextBirdTime = now + 3.8 + Math.random()*4.4;
    }
  }

  function applyGains(){
    if(!ac) return;
    const t=ac.currentTime;
    master.gain.setTargetAtTime(mode==='off'?0.0001:0.78, t, 0.35);
    musicGain.gain.setTargetAtTime(mode==='full'?1:0.0001, t, 0.35);
    natureGain.gain.setTargetAtTime(mode==='off'?0.0001:1, t, 0.35);
    sfxGain.gain.setTargetAtTime(mode==='off'?0.0001:0.9, t, 0.08);
  }

  function updateBtn(){
    const b=document.getElementById('bgmbtn'); if(!b) return;
    if(mode==='full'){ b.textContent='♫ 富林晨曲'; b.classList.add('bgm-on'); }
    else if(mode==='nature'){ b.textContent='🐦 仅鸟鸣'; b.classList.add('bgm-on'); }
    else { b.textContent='🔇 声音:关'; b.classList.remove('bgm-on'); }
  }

  function unlock(){
    if(mode==='off') return;
    if(!ensure()) return;
    if(ac.state==='suspended') ac.resume().catch(()=>{});
    if(!started){
      started=true;
      nextTime=ac.currentTime+0.08;
      nextBirdTime=ac.currentTime+1.2;
      timer=setInterval(schedule, 120);
    }
    applyGains();
  }

  function sfx(kind){
    if(mode==='off') return;
    unlock(); if(!ac) return;
    const t=ac.currentTime;
    try{
      if(kind==='collect'||kind==='card'){
        const notes=[69,72,77]; const f=m2f(notes[Math.floor(Math.random()*notes.length)]);
        const o=ac.createOscillator(), g=ac.createGain();
        o.type='sine'; o.frequency.setValueAtTime(f,t);
        g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.06,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+0.35);
        o.connect(g); route(g,0.28,sfxGain); o.start(t); o.stop(t+0.38);
        if(Math.random()<0.45) chirpBird(t+0.08, 0, 0.55);
      } else if(kind==='build'){
        [60,65].forEach((m,i)=>{
          const o=ac.createOscillator(), g=ac.createGain(), s=t+i*0.07;
          o.type='triangle'; o.frequency.setValueAtTime(m2f(m),s);
          g.gain.setValueAtTime(0.0001,s); g.gain.linearRampToValueAtTime(0.065,s+0.01); g.gain.exponentialRampToValueAtTime(0.0001,s+0.32);
          o.connect(g); route(g,0.25,sfxGain); o.start(s); o.stop(s+0.35);
        });
      } else if(kind==='observe'){
        [65,69,72,76,81].forEach((m,i)=>{
          const o=ac.createOscillator(), g=ac.createGain(), s=t+i*0.065;
          o.type='sine'; o.frequency.setValueAtTime(m2f(m),s);
          g.gain.setValueAtTime(0.0001,s); g.gain.linearRampToValueAtTime(0.055,s+0.015); g.gain.exponentialRampToValueAtTime(0.0001,s+0.68);
          o.connect(g); route(g,0.45,sfxGain); o.start(s); o.stop(s+0.72);
        });
        chirpBird(t+0.12, 1, 0.85);
      } else if(kind==='win'||kind==='ach'){
        [65,69,72,77,81,84].forEach((m,i)=>{
          const o=ac.createOscillator(), g=ac.createGain(), s=t+i*0.08;
          o.type='sine'; o.frequency.setValueAtTime(m2f(m),s);
          g.gain.setValueAtTime(0.0001,s); g.gain.linearRampToValueAtTime(0.06,s+0.015); g.gain.exponentialRampToValueAtTime(0.0001,s+0.85);
          o.connect(g); route(g,0.5,sfxGain); o.start(s); o.stop(s+0.9);
        });
      } else if(kind==='turn'){
        const o=ac.createOscillator(), g=ac.createGain();
        o.type='sine'; o.frequency.setValueAtTime(880,t);
        g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.032,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+0.28);
        o.connect(g); route(g,0.3,sfxGain); o.start(t); o.stop(t+0.3);
      } else {
        const o=ac.createOscillator(), g=ac.createGain();
        o.type='sine'; o.frequency.setValueAtTime(520,t);
        g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.03,t+0.005); g.gain.exponentialRampToValueAtTime(0.0001,t+0.06);
        o.connect(g); g.connect(sfxGain); o.start(t); o.stop(t+0.07);
      }
    }catch(e){}
  }

  function toggle(){
    mode = (mode==='full')?'nature':(mode==='nature'?'off':'full');
    try{ localStorage.setItem(KEY, mode); }catch(e){}
    updateBtn();
    if(mode==='off'){ applyGains(); }
    else { unlock(); if(mode==='nature') chirpBird(); else sfx('turn'); }
  }

  document.addEventListener('pointerdown', ()=>{ if(mode!=='off') unlock(); }, {passive:true});
  document.addEventListener('keydown', ()=>{ if(mode!=='off') unlock(); }, {passive:true});
  document.addEventListener('visibilitychange', ()=>{
    if(!ac) return;
    if(document.visibilityState==='hidden') ac.suspend().catch(()=>{});
    else if(mode!=='off') ac.resume().catch(()=>{});
  });
  window.addEventListener('DOMContentLoaded', updateBtn);
  return { toggle, sfx, unlock, chirpBird, getMode:()=>mode };
})();

/* 移动端长按卡牌放大预览 */
(function(){
  let timer, sx=0, sy=0, longPressOpened=false;
  function show(cardEl){
    if(cardEl.dataset.sjBird){ Songjiang.birdInfo(cardEl.dataset.sjBird); return; }
    let ov=document.getElementById('cardpreview');
    if(!ov){ ov=document.createElement('div'); ov.id='cardpreview'; ov.addEventListener('click',()=>{ ov.style.display='none'; }); document.body.appendChild(ov); }
    const clone=cardEl.cloneNode(true); clone.classList.remove('mini','dim','gmuted'); clone.removeAttribute('onclick');
    ov.innerHTML='<div class="pvbox"></div><div class="tip">点任意处关闭</div>';
    ov.querySelector('.pvbox').appendChild(clone);
    ov.style.display='flex';
  }
  document.addEventListener('pointerdown',()=>{longPressOpened=false;},true);
  document.addEventListener('touchstart',e=>{
    clearTimeout(timer); longPressOpened=false;
    const card=e.target.closest('.wrap .card,.wrap .gcard');
    if(!card || e.touches.length!==1) return;
    sx=e.touches[0].clientX; sy=e.touches[0].clientY;
    timer=setTimeout(()=>{
      if(card.isConnected && document.body.dataset.sjView==='board'){
        longPressOpened=true; show(card);
      }
    },380);
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    const t=e.touches[0];
    if(!t || Math.abs(t.clientX-sx)>12 || Math.abs(t.clientY-sy)>12) clearTimeout(timer);
  },{passive:true});
  document.addEventListener('touchend',e=>{
    clearTimeout(timer);
    // Some touch browsers retarget the release to the newly opened dialog.
    if(longPressOpened && e.cancelable) e.preventDefault();
  },{passive:false});
  document.addEventListener('touchcancel',()=>{clearTimeout(timer); longPressOpened=false;},{passive:true});
  document.addEventListener('click',e=>{
    if(longPressOpened && e.detail!==0){ e.preventDefault(); e.stopImmediatePropagation(); }
    longPressOpened=false;
  },true);
})();

/* ---------------------------- 动作发送 ---------------------------- */
function meSeat(){ return UI.online ? (UI.net?UI.net.seat:0) : UI.humanSeat; }
function myTurn(){
  const st=UI.state; if(!st||st.gameOver) return false;
  if(UI.online) return st.cur===UI.net.seat && !(st.seats&&st.seats[UI.net.seat]&&st.seats[UI.net.seat].cpu);
  return st.cur===UI.humanSeat;
}
function myP(){ const st=UI.state; return st?st.players[meSeat()]:null; }

/* 唯一的动作出口。联机 → 发给服务器；单机 → 直接调引擎。
   两边动作名与参数完全一致（见 server/hub-v6.js 的 ACT_OK）。 */
function send(a){
  if(a.type==='collectOne'||a.type==='collectTwo') BGM.sfx('collect');
  else if(a.type==='buildHabitat'||a.type==='buildBirds') BGM.sfx('build');
  else if(a.type==='obTake'){ BGM.sfx('observe'); observeAnim('观鸟拿取图鉴！'); }
  else if(a.type==='obTakeAch') BGM.sfx('ach');
  else if(a.type==='endTurn'||a.type==='obFinish') BGM.sfx('tap');

  if(UI.online){ UI.emit(a); UI.resetSel(); return; }
  const st=UI.state; let r;
  try{
    switch(a.type){
      case 'collectOne':   r=G.collectOne(st,a.i); break;
      case 'collectTwo':   r=G.collectTwo(st,a.i,a.j,a.drop); break;
      case 'buildHabitat': r=G.buildHabitat(st,a.src,a.hand,(a.group==null?null:a.group)); break;
      case 'buildBirds':   r=G.buildBirds(st,a.group,a.hab,a.hands); break;
      case 'endTurn':      r=G.endTurn(st); break;
      case 'obTake':       r=G.obTake(st,a.group,a.lvl,a.i,a.keep); break;
      case 'obTakeAch':    r=G.obTakeAch(st,a.id); break;
      case 'obFinish':     r=G.obFinish(st,!!a.declare); break;
      default: r={ok:false,err:'未知动作'};
    }
  }catch(e){ flash('非法操作'); UI.resetSel(); render(); return; }
  if(!r||!r.ok){ flash((r&&r.err)||'非法操作'); UI.resetSel(); render(); return; }
  UI.resetSel();
  if(a.type==='endTurn'||a.type==='obFinish'){ pump(); return; }
  render();
  if(a.type==='collectOne'||a.type==='collectTwo'){
    highlightArrivals(document.getElementById('handpool'), a.type==='collectTwo'?2:1);
  } else if(a.type==='buildHabitat'||a.type==='buildBirds'){
    const group=r.group??a.group, habitat=r.hab??a.hab, count=a.hands?.length??1;
    const placed=myP().groups[group].habs[habitat];
    const names=placed.birds.slice(-count).map(key=>S[key].name).join('、');
    document.getElementById('hint').textContent=names+'已放入群落 '+(group+1)+' 的'+placed.ls+'。';
    highlightArrivals(document.getElementById('sj-birds-'+group+'-'+habitat),count);
  }
}

/* 单机：把电脑座位一路走完，直到轮到人类或对局结束 */
function pump(){
  const st=UI.state;
  if(!st) return;
  if(st.gameOver){ UI.phase='over'; render(); renderGameOver(); return; }
  if(st.players[st.cur].isCPU){
    UI.phase='wait'; render();
    setTimeout(function(){ if(!UI.state||UI.state!==st) return; const actor=st.players[st.cur]; const before=Songjiang.beforeTurn(st,actor); G.cpuTurn(st); Songjiang.comment(st,actor,before); pump(); }, CPU_DELAY);
    return;
  }
  UI.phase='play'; render();
}

/* ---------------------------- 玩家操作 ---------------------------- */
UI.clickMarket=function(i){
  if(!myTurn()) return;
  const st=UI.state;
  if(st.phase!=='play'){ flash('现在是观鸟阶段'); return; }
  if(st._collected){ flash('本回合已经采集过了'); return; }
  if(UI.swap){
    const m=UI.swap.market, at=m.indexOf(i);
    if(at>=0) m.splice(at,1); else if(m.length<2) m.push(i); else { m.shift(); m.push(i); }
    BGM.sfx('tap'); render(); return;
  }
  send({type:'collectOne', i:i});
};
UI.toggleSwap=function(){
  if(!myTurn()) return;
  const st=UI.state;
  if(st._collected){ flash('本回合已经采集过了'); return; }
  UI.swap = UI.swap ? null : {market:[], hand:null};
  UI.build=null; BGM.sfx('tap'); render();
};
UI.clickHand=function(i){
  if(!myTurn()) return;
  const st=UI.state;
  if(UI.swap){ UI.swap.hand = (UI.swap.hand===i? null : i); BGM.sfx('tap'); render(); return; }
  if(UI.build && UI.build.step==='bird'){ const src=UI.build.src; if(!G.birdLegal(myP().hand[i], src.plain||myP().reserve[src.reserve].ls)) return; UI.build={step:'target', src:UI.build.src, hand:i}; BGM.sfx('tap'); render(); return; }
  if(UI.build && UI.build.step==='birds'){
    const p=UI.build.picks, at=p.indexOf(i);
    if(at>=0) p.splice(at,1);
    else {
      const hab=myP().groups[UI.build.group].habs[UI.build.hab];
      if(!G.birdLegal(myP().hand[i],hab.ls)) return;
      const room=G.SEG_CAP-hab.birds.length;
      if(p.length>=Math.min(2,room)) p.shift();
      p.push(i);
    }
    BGM.sfx('tap'); render(); return;
  }
  flash('先选一张景观（或点群落里的空位）再选鸟');
};
UI.doSwap=function(){
  const s=UI.swap; if(!s||s.market.length!==2||s.hand==null) return;
  send({type:'collectTwo', i:s.market[0], j:s.market[1], drop:s.hand});
};
// 选一张景观来源（普通景观 或 储备区图鉴）
UI.pickSrc=function(kind, key){
