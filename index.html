/* 观鸟 */
UI.pickGroup=function(gi){ if(!myTurn()) return; UI.obGroup = (UI.obGroup===gi? null : gi); BGM.sfx('tap'); render(); };
UI.takeGuide=function(lvl,i){
  if(!myTurn()) return;
  const st=UI.state;
  if(st.phase!=='observe'){ flash('还没到观鸟阶段'); return; }
  if(st.obTaken){ flash('本轮已经观鸟拿卡了'); return; }
  const p=myP();
  const pool = lvl===1? st.pool1 : st.pool2;
  const g=pool[i]; if(!g) return;
  // 找出哪些群落满足它
  const okGroups=[];
  p.groups.forEach((gr,gi)=>{ if(G.guideMetGroup(g,gr)) okGroups.push(gi); });
  if(!okGroups.length){ flash('你没有任何鸟类群落满足这张图鉴的条件'); return; }
  if(UI.obGroup!=null && okGroups.indexOf(UI.obGroup)>=0){ BGM.sfx('tap'); UI.openKeepChoice(UI.obGroup,lvl,i); return; }
  if(okGroups.length===1){ BGM.sfx('tap'); UI.openKeepChoice(okGroups[0],lvl,i); return; }
  UI.obGroup=null; flash('有 '+okGroups.length+' 个群落都满足 —— 先点选要用哪个群落观鸟（观鸟会归还该群落的鸟）');
  render();
};
UI.openKeepChoice=function(group,lvl,i){
  const st=UI.state,p=myP(),gr=p.groups[group],pool=lvl===1?st.pool1:st.pool2,g=pool[i];
  if(!gr||!g) return;
  const quota=G.keepQuota(p,g);
  let rows='';
  gr.habs.forEach((h,hi)=>h.birds.forEach((k,bi)=>{
    const sp=G.SPECIES[k]; if(!sp||!quota[sp.cat]) return;
    rows+='<div class="setrow" style="align-items:center;border-bottom:1px solid #e8eee6;padding:7px 0">'
      +'<label style="display:flex;align-items:center;gap:7px;min-width:190px"><input class="keepbird" type="checkbox"'
      +' data-hab="'+hi+'" data-bird="'+bi+'" data-cat="'+esc(sp.cat)+'">'
      +esc(sp.name)+'（'+esc(sp.cat)+'，第 '+(hi+1)+' 个栖息地）</label>'
      +(hi>0?'<span class="hint">必须收回手牌</span>'
        :'<select class="keepdest"><option value="stay">留在原位</option><option value="hand">收回手牌</option></select>')
      +'</div>';
  }));
  const limits=Object.keys(quota).filter(c=>quota[c]>0).map(c=>c+'最多 '+quota[c]+' 只').join('，');
  document.getElementById('overlay').innerHTML='<div class="overlay"><div class="modal"><h2>🔭 选择保留的鸟</h2>'
    +'<p>你将拿取图鉴【'+esc(g.name)+'】。请选择要保留的鸟；未选择的鸟会回到公共弃牌区。</p>'
    +'<p class="hint">保留名额：'+esc(limits||'无')+'。第 1 个栖息地的保留鸟可留在原位或收回手牌；第 2 个必须收回手牌。</p>'
    +(rows||'<p class="hint">这个群落里没有符合保留名额的鸟。</p>')
    +'<p id="keeperr" style="color:#b23b2b"></p><div style="text-align:right;margin-top:12px">'
    +'<button class="ghost" onclick="clearOverlay()">取消</button> '
    +'<button class="big" onclick="UI.confirmKeep('+group+','+lvl+','+i+')">确认观鸟</button></div></div></div>';
};
UI.confirmKeep=function(group,lvl,i){
  const p=myP(),pool=lvl===1?UI.state.pool1:UI.state.pool2,g=pool[i]; if(!g) return;
  const quota=G.keepQuota(p,g), used={}, keep=[];
  document.querySelectorAll('.keepbird:checked').forEach(cb=>{
    const cat=cb.dataset.cat, row=cb.closest('.setrow'), dest=row&&row.querySelector('.keepdest');
    used[cat]=(used[cat]||0)+1;
    keep.push({hab:Number(cb.dataset.hab),bird:Number(cb.dataset.bird),toHand:Number(cb.dataset.hab)>0||!!(dest&&dest.value==='hand')});
  });
  const over=Object.keys(used).find(c=>used[c]>(quota[c]||0));
  if(over){ const e=document.getElementById('keeperr'); if(e)e.textContent=over+'最多只能保留 '+quota[over]+' 只'; return; }
  clearOverlay(); send({type:'obTake',group:group,lvl:lvl,i:i,keep:keep});
};
UI.showStamps=function(){

/* ---------------------------- 渲染 ---------------------------- */
function clearOverlay(){ document.getElementById('overlay').innerHTML=''; }
function flash(m){
  const h=document.getElementById('hint');
  if(!h) return;
  h.textContent='⚠️ '+m; h.style.color='#c1572f';
  setTimeout(()=>{ h.style.color=''; },2400);
}
function render(){
  const st=UI.state; if(!st) return;
  if(!st.gameOver){
    if(UI._lastPh===undefined){ UI._lastPh=st.phase; UI._lastRd=st.round; }
    else {
      if(st.phase==='observe' && UI._lastPh!=='observe') showPhaseBanner('🔭 观鸟阶段<span class="sub">按顺位检视群落，满足条件即可拿取图鉴</span>','ob');
      else if(st.round!==UI._lastRd) showPhaseBanner('🌅 第 '+st.round+' 轮<span class="sub">松江印象 · 新一轮采集与构建</span>','');
      UI._lastPh=st.phase; UI._lastRd=st.round;
    }
    const nowMine=myTurn();
    if(nowMine && !UI._wasMyTurn) BGM.sfx('turn');
    UI._wasMyTurn=nowMine;
  }
  renderGoal(); renderHud(); renderScore(); renderMarket(); renderPools(); renderAch();
  renderMine(); renderOpps(); renderBar(); renderLog(); renderHot(); guideNextAction();
}
function renderHot(){
  document.querySelectorAll('.zone-hot').forEach(e=>e.classList.remove('zone-hot'));
  const st=UI.state; if(!st || st.gameOver || !myTurn()) return;
  const p=myP(), b=UI.build;
  if(st.phase==='play'){
    if(UI.swap){ ['market','handpool'].forEach(id=>{ const e=document.getElementById(id); if(e) e.classList.add('zone-hot'); }); return; }
    if(b && (b.step==='bird'||b.step==='birds')){ const e=document.getElementById('handpool'); if(e) e.classList.add('zone-hot'); return; }
    if(b && b.step==='target'){ const e=document.getElementById('mygroups'); if(e) e.classList.add('zone-hot'); return; }
    if(!st._collected && G.canCollect(st)){ const e=document.getElementById('market'); if(e) e.classList.add('zone-hot'); }
    else if(!st._built && G.canBuild(p)){
      for(const id of ['plainpool','reservepool','mygroups']){
        const e=document.getElementById(id);
        if(e && e.querySelector('.legal,.slot.clk')) e.classList.add('zone-hot');
      }
    }
  } else if(st.phase==='observe' && !st.obTaken){
    const opts=G.observableOptions(st,p);
    if(opts.length){
      const multi=p.groups.filter(gr=>st.pool1.concat(st.pool2).some(g=>G.guideMetGroup(g,gr))).length>1;
      if(multi && UI.obGroup==null){ const e=document.getElementById('mygroups'); if(e) e.classList.add('zone-hot'); }
      else { ['pool1','pool2'].forEach(id=>{ const e=document.getElementById(id); if(e) e.classList.add('zone-hot'); }); }
    }
  }
}
let nextActionTarget='';
function guideNextAction() {
  if (document.body.dataset.sjView!=='board' || !UI.state || UI.state.gameOver) return;
  const st=UI.state, mine=myTurn(), b=UI.build, player=myP();
  let target='sj-stepbar';
  if(mine && st.phase==='play') {
    if(UI.swap) target=UI.swap.market.length<2?'market':UI.swap.hand===null?'handpool':'sj-stepbar';
    else if(b) target=b.step==='target'?'mygroups':(b.step==='birds'&&b.picks.length?'sj-stepbar':'handpool');
    else if(!st._collected && G.canCollect(st)) target='market';
    else if(!st._built && G.canBuild(player)) {
      const legal=document.querySelector('#plainpool .legal, #reservepool .legal');
      target=legal?legal.parentElement.id:'mygroups';
    }
  } else if(mine && st.phase==='observe' && !st.obTaken && G.observableOptions(st,player).length) {
    target=UI.obGroup==null && document.getElementById('mygroups').classList.contains('zone-hot')?'mygroups':'sj-guides';
  }
  const changed=target!==nextActionTarget;
  const previous=nextActionTarget;
  nextActionTarget=target;
  const el=document.getElementById(target);
  if(changed && target==='sj-guides') el.open=true;
  const bar=document.getElementById('sj-stepbar');
  bar.dataset.next=target;
  if(changed && previous && mine && el && window.matchMedia('(max-width:820px)').matches && !document.querySelector('#overlay .modal, dialog[open]')) {
    requestAnimationFrame(()=>{
      if(document.body.dataset.sjView!=='board' || !el.isConnected || nextActionTarget!==target) return;
      const focusArea=target==='sj-guides' ? (el.querySelector('.gcard.legal')||el) : el;
      const rect=focusArea.getBoundingClientRect();
      if(rect.top<14 || rect.top>innerHeight-112 || (rect.height<innerHeight*.65 && rect.bottom>innerHeight-12))
        focusArea.scrollIntoView({block:'center',behavior:'instant'});
    });
  }
}
function renderGoal(){
  const st=UI.state, me=meSeat();
  const sc=G.currentScore(st,me);
  document.getElementById('progbar').style.width=Math.max(0,Math.min(100,sc/G.WIN_SCORE*100))+'%';
  document.getElementById('progtxt').textContent=sc+' / '+G.WIN_SCORE;
}
function renderHud(){
  const st=UI.state, el=document.getElementById('roundhud');
  el.style.display='';
  const who=st.cur===meSeat()?'轮到你':Songjiang.persona(st.players[st.cur].style).short+'的回合';
  el.innerHTML='<b>第 '+st.round+' 轮</b><span>'+(st.phase==='play'?'行动':'观鸟')+' · '+who+'</span>';

function renderScore(){
  const st=UI.state;
  document.getElementById('scoreboard').innerHTML=st.players.map((p,i)=>{
    const played=G.allHabs(p).filter(h=>h.guide).length;
    return '<div class="pchip'+(i===st.cur?' active':'')+'">'
      +'<div class="nm">'+(p.isCPU?'🤖':'🧑')+' '+esc(st.names?st.names[i]:p.name)
        +(i===meSeat()?'<span class="tag">你</span>':'')+'</div>'
      +'<div class="sc">'+G.currentScore(st,i)+'</div>'
      +'<div class="det">图鉴打出 '+played+' 张 · 储备 '+p.reserve.length+' 张（终局每张 −1）</div>'
      +'<div class="det">群落 '+p.groups.length+' 个 · 手牌 '+p.hand.length+' 张'
        +(p.ach!=null?' · 成就'+p.ach:'')+'</div>'
      +'</div>';
  }).join('');
}

    const sel=UI.swap && UI.swap.market.indexOf(i)>=0;
    return birdCard(k,{id:'mk'+i,clk:mine,legal:mine&&!UI.swap,sel:sel,onclick:'UI.clickMarket('+i+')'});
  }).join('') || '<span class="hint">展示区已空</span>';
  const sight=document.getElementById('sj-sighting');

  sight.hidden=!key;
  if(key){
    sight.innerHTML=birdArt(key)+'<span><small>桌边手记</small><b>'+esc(S[key].name)+'</b><span>'+esc(Songjiang.birdNote(key))+'</span></span>';
    sight.onclick=()=>Songjiang.birdInfo(key);
  }
}
// 图鉴进度徽章：以「我最接近的那个群落」为准
function guideProgress(g,p){
  let best=null;
  p.groups.forEach((gr,gi)=>{
    let gap=0; for(const c in g.req) gap+=Math.max(0,g.req[c]-G.groupCat(gr,c));
    if(best===null||gap<best.gap) best={gap:gap,gi:gi};
  });
  if(!best) return {txt:'还没有群落',cls:'',gap:99};
  if(best.gap===0) return {txt:'✔ 群落'+(best.gi+1)+' 可拿',cls:'ok',gap:0};
  return {txt:'群落'+(best.gi+1)+' 还差 '+best.gap+' 只',cls:best.gap<=1?'near':'',gap:best.gap};
}
function renderPools(){
  const st=UI.state, p=myP();
  const canTake = myTurn() && st.phase==='observe' && !st.obTaken;
  let readyCnt=0, nearCnt=0;
  function row(pool,lvl,el){
    document.getElementById(el).innerHTML=pool.map((g,i)=>{
      const pr=guideProgress(g,p);
      if(pr.gap===0) readyCnt++; else if(pr.gap===1) nearCnt++;
      const met = p.groups.some(gr=>G.guideMetGroup(g,gr));
      const usable = canTake && met && (UI.obGroup==null || G.guideMetGroup(g,p.groups[UI.obGroup]));
      const muted = UI.guideFilter && pr.gap>1;
      return guideCard(g,{clk:canTake&&met, legal:usable, dim:canTake&&!met, muted:muted,
        prog:pr.txt, progCls:pr.cls, onclick:'UI.takeGuide('+lvl+','+i+')'});
    }).join('') || '<span class="hint">本级图鉴已被拿完</span>';
  }
  row(st.pool1,1,'pool1'); row(st.pool2,2,'pool2');
  const sum=document.getElementById('guidesummary');
  if(sum) sum.textContent = '可拿 '+readyCnt+' · 差一只 '+nearCnt;
  document.getElementById('sj-guide-count').textContent=(st.pool1.length+st.pool2.length)+' 张';
}
function renderAch(){
  const st=UI.state, p=myP();
  const canTake = myTurn() && st.phase==='observe' && p.ach==null;
  const award=G.ACH.filter(a=>st.achPool.some(slot=>slot.id===a.id&&!slot.taken)&&G.achMet(p,a));
  if(canTake && award.length && st.obTaken) document.getElementById('sj-stamps').open=true;
  document.getElementById('sj-stamp-count').textContent=p.ach!=null?'已领 '+Songjiang.stamp(p.ach):award.length?'可领 '+award.length+' 枚':'每人限领一枚';
  document.getElementById('achs').innerHTML=G.ACH.map(a=>{
    const slot=st.achPool.find(x=>x.id===a.id);
    const taken=!slot||slot.taken;
    const met=!taken&&G.achMet(p,a);
    return '<div class="achcard'+(taken?' taken':'')+(canTake&&met?' legal':'')+'"'
      +(canTake&&met?' role="button" tabindex="0" onclick="UI.takeAch('+a.id+')"':'')+'>'
      +'<div class="p">'+a.pts+'</div><div class="id">'+Songjiang.stamp(a.id)+(taken?'（已领）':'')+'</div>'
      +'<div class="tx">'+Object.keys(a.req).map(L=>lc(L).icon+L+'×'+a.req[L]).join(' ')+'</div>'
      +(met?'<div class="tx" style="color:#2c6e36;font-weight:700">✔ 你已达成，可拿</div>':'')
      +'</div>';
  }).join('');
}
/* 我的桌面：手牌 / 普通景观 / 储备图鉴 / 鸟类群落 */
function renderMine(){
  const st=UI.state, p=myP(), me=meSeat();
  document.getElementById('mytitle').textContent='我的桌面';
  const b=UI.build;
  const playing = myTurn() && st.phase==='play';
  const building = playing && (st._collected || !G.canCollect(st));
  let h='';
  function canUseLand(land) { return building && !st._built && p.hand.some(key=>G.birdLegal(key,land)); }

  /* 普通景观 + 储备图鉴 */
  h+='<div class="sj-resources">';
  h+='<div><div class="lab">可用景观</div><div class="row" id="plainpool">';
  h+= p.plain.length ? p.plain.map(L=>landCard(L,{clk:canUseLand(L),
        legal:canUseLand(L), sel:!!(b&&b.src&&b.src.plain===L),
        onclick:'UI.pickSrc(\'plain\',\''+L+'\')'})).join('')
      : '<span class="hint">已全部打出</span>';
  h+='</div></div>';
  h+='<div><div class="lab">储备图鉴</div><div class="row" id="reservepool">';
  h+= p.reserve.length ? p.reserve.map((g,i)=>landCard(g.ls,{pts:g.pts, clk:canUseLand(g.ls),
        legal:canUseLand(g.ls), sel:!!(b&&b.src&&b.src.reserve===i),
        onclick:'UI.pickSrc(\'reserve\','+i+')'})).join('')
      : '<span class="hint">尚未收图鉴</span>';
  h+='</div></div></div>';

  const resources=h; h='';
  /* 鸟类群落 */
  h+='<div class="lab">我的群落</div>';
  h+='<div class="groups" id="mygroups">';
  p.groups.forEach((gr,gi)=>{
    const met = st.pool1.concat(st.pool2).some(g=>G.guideMetGroup(g,gr));
    const cls=['group']; if(met)cls.push('metgd'); if(UI.obGroup===gi)cls.push('sel');
    h+='<div class="'+cls.join(' ')+'"'
      + (st.phase==='observe'&&myTurn()? ' onclick="UI.pickGroup('+gi+')" style="cursor:pointer"':'') +'>';
    const cnt=G.CATS.map(c=>{const n=G.groupCat(gr,c); return n?c.slice(0,1)+n:null;}).filter(Boolean).join(' ');
    h+='<div class="ghd"><b>群落 '+(gi+1)+'</b><span>'+(cnt||'（空）')+'</span>'
      +(met?'<span style="color:#2c6e36;font-weight:700">🔭 有图鉴可拿</span>':'')+'</div>';
    h+='<div class="habs2">';
    gr.habs.forEach((hab,hi)=>{
      const closed = hi<gr.fillFrom;
      h+='<div class="hab'+(closed?' closed':'')+'" title="'+(closed?'已封闭：开建右侧后不能回头':'')+'">';
      h+=landCard(hab.ls,{pts:hab.guide?hab.guide.pts:0});
      h+='<div class="bslots">';
      hab.birds.forEach(k=>{ h+=birdCard(k,{mini:true}); });
      const room=G.SEG_CAP-hab.birds.length;
      if(room>0){
        const can = building && !st._built && !closed && p.hand.some(k=>G.birdLegal(k,hab.ls));
        const isSel = b&&b.step==='birds'&&b.group===gi&&b.hab===hi;
        h+='<div class="slot'+(can?' clk':'')+'"'+(can?' role="button" tabindex="0" onclick="UI.pickHab('+gi+','+hi+')"':'')+'>'
          +(isSel?'选鸟中':(closed?'已封闭':'空 '+room+' 位'))+'</div>';
      }
      h+='</div></div>';
    });
    // 扩建第 2 个栖息地
    if(gr.habs.length<G.HAB_CAP){
      const canExpand = b&&b.step==='target' && gr.habs[gr.habs.length-1].birds.length>0;
      h+='<div class="addhab'+(canExpand?' clk':'')+'"'+(canExpand?' role="button" tabindex="0" onclick="UI.pickTarget('+gi+')"':'')+'>'
        +(canExpand?'＋ 建在这里':'第 2 个<br>栖息地')+'</div>';
    }
    h+='</div></div>';
  });
  // 新建群落
  if(b&&b.step==='target'){
    h+='<div class="newgroup clk" role="button" tabindex="0" onclick="UI.pickTarget(null)">＋ 开一个新群落</div>';
  } else if(!p.groups.length){
    h+='<div class="newgroup">选一张景观和一只鸟，建立第一个群落</div>';
  }
  h+='</div>';

  const groups=h; h='';
  /* 手牌 */
  const needBird = !!(b&&(b.step==='bird'||b.step==='birds')) || !!(UI.swap);
  h+='<div class="lab" style="margin-top:12px">我的手牌（'+p.hand.length+' 张）'
    +(needBird?'　<b style="color:#3a7d44">← 请从这里选鸟</b>':'')+'</div><div class="row" id="handpool">';
  h+= p.hand.map((k,i)=>{
    let legal=false, sel=false, dim=false;
    if(UI.swap){ legal=true; sel=UI.swap.hand===i; }
    else if(b&&b.step==='bird'){ const ls=b.src.plain||p.reserve[b.src.reserve].ls;
      legal=G.birdLegal(k,ls); dim=!legal; }
    else if(b&&b.step==='target'){ sel=(b.hand===i); dim=!sel; }
    else if(b&&b.step==='birds'){ const hab=p.groups[b.group].habs[b.hab];
      legal=G.birdLegal(k,hab.ls); dim=!legal; sel=b.picks.indexOf(i)>=0; }
    return birdCard(k,{id:'hb'+i,clk:needBird&&(legal||sel), legal:legal&&!sel, sel:sel, dim:dim,
      onclick:'UI.clickHand('+i+')'});
  }).join('') || '<span class="hint">没有手牌</span>';
  h+='</div>';
  document.getElementById('mybody').innerHTML=resources+'<div class="sj-hand-section">'+h+'</div><div class="sj-group-section">'+groups+'</div>';
}
function renderOpps(){
  const st=UI.state, me=meSeat();
  document.getElementById('opps').innerHTML=st.players.map((p,i)=>{
    if(i===me) return '';
    const gs=p.groups.map((gr,gi)=>'群落'+(gi+1)+'：'
      +gr.habs.map(hh=>Songjiang.place(hh.ls).short+(hh.guide?'（图鉴）':'')+' · '+(hh.birds.length?hh.birds.map(k=>S[k]?S[k].name:'鸟牌').join('、'):'暂无鸟')).join(' ＋ ')
    ).join('<br>') || '（还没有群落）';
    return '<div class="opp"><div class="on">'+(p.isCPU?'🤖':'🧑')+' '+esc(st.names?st.names[i]:p.name)
      +(i===st.cur?' ⬅ 行动中':'')+'</div>'
      +'<div class="gsum">'+gs+'</div>'
      +'<div class="gsum">手牌 '+p.hand.length+' 张 · 储备 '+p.reserve.length+' 张 · 未打出普通景观 '+p.plain.length+' 张</div>'
      +'</div>';
  }).join('') || '<span class="hint">—</span>';
}
function renderBar(){
  const st=UI.state, p=myP(), b=UI.build;
  const prompt=document.getElementById('prompt'), btns=document.getElementById('btns'), hint=document.getElementById('hint');
  let pr='', bs='', hi='';
  if(st.gameOver){ pr='对局结束'; btns.innerHTML='<button class="big" onclick="UI.openSetup()">再来一局</button>'; prompt.textContent=pr; hint.textContent=''; return; }
  if(!myTurn()){
    const cur=st.names?st.names[st.cur]:st.players[st.cur].name;
    pr='⏳ 等待 '+esc(cur)+(st.phase==='observe'?' 观鸟…':' 行动…');
    prompt.innerHTML=pr; btns.innerHTML=''; hint.textContent=''; return;
  }
  if(st.phase==='play'){
    const s1=st._collected||!G.canCollect(st), s2=st._built||!G.canBuild(p);
    pr='<span class="step '+(s1?'done':'now')+'">1 采集'+(s1?' ✔':'')+'</span>'
      +'<span class="step '+(s1&&!s2?'now':(s2?'done':''))+'">2 构建'+(s2?' ✔':'')+'</span>'
      +'<span class="step '+(s1&&s2?'now':'')+'">3 结束回合</span>';
    if(UI.swap){
      pr+='<br>采集 2 张：已选展示区 '+UI.swap.market.length+'/2，弃牌 '+(UI.swap.hand==null?'未选':'已选');
      bs+='<button class="big" '+(UI.swap.market.length===2&&UI.swap.hand!=null?'':'disabled')+' onclick="UI.doSwap()">确定采集 2 张并弃 1 张</button>';
      bs+='<button class="ghost" onclick="UI.toggleSwap()">取消</button>';
    } else if(b&&b.step==='bird'){
      const ls=b.src.plain||p.reserve[b.src.reserve].ls;
      pr+='<br>已选'+ls+'。从手牌选一只能住进去的鸟。';
      bs+='<button class="ghost" onclick="UI.cancelBuild()">取消</button>';
    } else if(b&&b.step==='target'){
      pr+='<br>选一个空位扩建，或开一个新群落。';
      bs+='<button class="ghost" onclick="UI.cancelBuild()">取消</button>';
    } else if(b&&b.step==='birds'){
      const hab=p.groups[b.group].habs[b.hab];
      pr+='<br>往群落'+(b.group+1)+'的【'+hab.ls+'】放鸟：已选 '+b.picks.length+' 只（一次可放 1–2 只）';
      bs+='<button class="big" '+(b.picks.length?'':'disabled')+' onclick="UI.doPlaceBirds()">确定放入</button>';
      bs+='<button class="ghost" onclick="UI.cancelBuild()">取消</button>';
    } else {
      if(!s1) {
        hi='点展示区的一只鸟，收进手牌。';
        bs+='<button class="ghost" onclick="UI.toggleSwap()">改为拿两张、弃一张</button>';
      } else if(!s2) {
        hi='点亮起的景观，或点已有群落的空位补鸟。';
      } else {
        hi='这一回合的行动已完成。';
        bs+='<button class="big gold" onclick="UI.endTurn()">结束回合 →</button>';
      }
    }
  } else {
    // 观鸟阶段
    const opts=G.observableOptions(st,p);
    if(st.obTaken){
      pr='🔭 本轮已拿到图鉴。';
    } else if(opts.length){
      pr='本轮有 '+opts.length+' 个群落与图鉴的组合可收。'
        + (p.groups.length>1?'多个群落都满足时，先选群落。':'');
    } else {
      pr='本轮还没有可收的图鉴。';
    }
    const sc=G.currentScore(st,meSeat());
    if(p.ach==null && st.achPool.some(slot=>!slot.taken && G.achMet(p,G.ACH.find(a=>a.id===slot.id)))) {
      bs+='<button class="ghost" onclick="UI.showStamps()">可领云间印章</button>';
    }
    if(sc>=G.WIN_SCORE) bs+='<button class="big gold" onclick="UI.obFinish(true)">宣布终局（'+sc+' 分）★</button>';
    bs+='<button class="big" onclick="UI.obFinish(false)">结束观鸟 ▶</button>';
    hi=opts.length&&!st.obTaken?'点开公共图鉴，选择亮起的卡。收进储备后，须打出才计分。':'';
  }
  prompt.innerHTML=pr; btns.innerHTML=bs;
  if(hint.style.color==='') hint.textContent=hi;
  else hint.dataset.pending=hi;
}

    {name:'山阳桥',land:'树冠', bird:'yelu', choices:['banjiu','yelu','cuiniao'], clue:'岸树上缩着一只短脖子的鸟。黑顶、灰翅，眼睛红红的。请从卡片里认出它。', hint:'看成鸟的黑顶和红眼。珠颈斑鸠的识别点在颈侧，普通翠鸟的背部是蓝色。'},

<script>
/* Local field journal, guided route and competition table. No remote data is needed to play. */
const Songjiang = (() => {
  'use strict';
  const D = SongjiangData;
  const screen = document.getElementById('sj-screen');
  const marksKey = 'birding-songjiang.marks.v1';
  let view = 'home';
  let journalReturn = 'home';
  let journalTab = 'birds';
  let trip = null;
  const species = Object.assign({}, G.SPECIES, Object.fromEntries(G.PACKS.stretch.map(b => [b.key, b])));

  function place(land) { return D.places[land]; }
  function persona(key) { return D.personas[key] || D.personas.balance; }
  function stamp(id) { return D.stamps[id]; }
  function birdNote(key) { return D.birds[key] || D.tips[key] || ''; }
  function action(key, label, css = 'sj-primary', value = '') {
    return `<button type="button" class="${css}" data-action="${key}" data-value="${esc(value)}">${label}</button>`;
  }
  function cite(key) {
    const [title, url] = D.sources[key];
    return `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(title)}</a>`;
  }
  function soundLabel() {
    return {full:'♫ 富林晨曲', nature:'♪ 水岸鸟鸣', off:'声音已关'}[BGM.getMode()];
  }
  const routeArt = ['shanyang-bridge', 'chenshan-meadow', 'chenshan-water'];
  function picture(key, description, className = '') {
    return '<img class="'+className+'" src="'+SJ_MEDIA[key]+'" alt="'+esc(description)+'" draggable="false">';
  }
  function header() {
    return `<header class="sj-head"><button type="button" class="sj-brand" data-action="home">
      <span class="sj-brand-mark" aria-hidden="true">${birdArt('yelu')}</span>观鸟俱乐部</button>
      <nav class="sj-nav" aria-label="游戏导航">${action('journal','观鸟手册','sj-back')}${action('sound',soundLabel(),'sj-back sj-sound')}</nav></header>`;
  }
  function footer() {
    return '<footer class="sj-foot"><span>桌游设计与原作美术　海兔　／　数字版　Ethan8</span><details><summary>制作与资料</summary><p>鸟牌、景观牌原画 © 海兔，经授权用于本游戏。四幅松江场景使用 OpenAI 图像生成功能辅助绘制。Codex 辅助松江版界面、代码与测试。早期项目使用过 Claude，程序音景有 Gemini 辅助。电脑对手按本地游戏规则出牌。</p><p>自然观察出处收在手册内。<a href="https://birdingclub-online.try-board-game.uk/" target="_blank" rel="noopener noreferrer">原作 Dora 数字版</a></p></details></footer>';
  }
  function paint(next, markup, scroll = true) {
    view = next;
    document.body.dataset.sjView = next;
    screen.hidden = false;
    screen.innerHTML = header() + markup + footer();
    if (scroll) window.scrollTo(0,0);
  }
  function scene() {
    return '<figure class="sj-art">'+picture('songjiang-cover','枝上的夜鹭回望富林湖，远处是佘山观象台。松江景观合绘。')+'</figure>';
  }
  function getMarks() {
    try {
      const v = JSON.parse(localStorage.getItem(marksKey) || '{}');
      return v && typeof v === 'object' ? v : {};
    } catch { return {}; }
  }
  function keepMark(id) {
    try { localStorage.setItem(marksKey, JSON.stringify({...getMarks(), [id]:true})); } catch { /* Offline play also works without storage. */ }
  }
  function home() {
    clearOverlay();
    const marks = getMarks();
    const earned = Number(!!marks.A12) + Number(!!marks.B2);
    const tiles = Object.entries(D.places).map(([land,p]) => `<li><button type="button" data-action="sites">${landArt(land)}<span><small>${land}</small><b>${p.short}</b></span></button></li>`).join('');
    const playing = UI.state && !UI.state.gameOver;
    const routeLabel = trip && trip.phase !== 'result' ? '继续辰山寻鸟' : '开始辰山寻鸟';
    paint('home', `<section class="sj-hero"><div class="sj-hero-copy">
      <p class="sj-eye">上海 · 松江</p><h1>观鸟俱乐部<span>松江印象</span></h1>
      <p class="sj-deck">从山阳桥走到辰山水岸，认出枝头的鸟，把今天的发现收进图鉴。</p>
      <div class="sj-actions">${action('route',routeLabel+' ↗')}${playing?action('board','继续牌局','sj-secondary'):action('setup','自由牌局','sj-secondary')}</div></div>${scene()}</section>
      <section class="sj-section"><div class="sj-section-head"><h2>牌桌上的松江</h2><span>路线纪念章　${earned} / 2</span></div>
      <ul class="sj-places">${tiles}</ul></section>`);
  }

  function newTrip() {
    const state = G.newGame({names:['你','同行鸟友'],cpu:[false,true],seed:20261123});
    // A teaching position with just the observer's one group. Preserve the bird
    // supply when moving a card in or out so settlement uses the real engine.
    for (const p of state.players) p.hand.length = 0;
    state.deck = G.buildDeck(null);
    state.market = [];
    // The short route spends its last stop playing the guide with this starting bird.
    state.players[0].hand.push(state.deck.splice(state.deck.indexOf('banjiu'),1)[0]);
    state.players[0].groups = [{habs:[],fillFrom:0}];
    return {state,step:0,phase:'identify',found:[],guide:null,receipt:null};
  }
  function routebar() {
    return '<ol class="sj-routebar" aria-label="观鸟路线">' + D.route.map((r,i) => {
      const current = i===trip.step && trip.phase!=='result' ? ' aria-current="step"' : '';
      const done = trip.found.includes(r.bird) ? ' class="sj-done"' : '';
      return `<li${current}${done}>${i+1} · ${r.name}</li>`;
    }).join('') + '</ol>';
  }
  function pickCard(key) {
    const sp=species[key];
    return `<button type="button" class="sj-pick" data-action="identify" data-value="${key}">
      ${birdArt(key,sp.cat)}<strong>${sp.name}</strong><small>${sp.cat}</small></button>`;
  }
  function fieldSpecimen(key) {
    return `<div class="sj-find"><div>${birdArt(key,species[key].cat)}</div><div>
      <h2>${species[key].name}</h2><p>${D.birds[key]}</p></div></div>`;
  }
  function tripBody() {
    const r=D.route[trip.step];
    if (trip.phase==='identify') return `<div class="sj-stop-grid"><figure class="sj-stop-art">${picture(routeArt[trip.step],r.name+'冬日景观示意插画')}<figcaption>${r.name}</figcaption></figure><div class="sj-observe"><h1>${r.name}寻鸟</h1><p class="sj-question">${r.clue}</p><div class="sj-cards">${r.choices.map(pickCard).join('')}</div><p class="sj-feedback" id="sj-feedback" aria-live="polite"></p></div></div>`;
    if (trip.phase==='place') {
      const instruction = {yelu:'用树冠牌开一个群落。夜鹭在牌桌上提供一个涉禽名额。',daisheng:'刚才是在草地辨认它。现在翻看牌面，戴胜可住树冠或湿地；把它接到夜鹭所在的树冠，两只鸟就能合交一张图鉴。',cuiniao:'给同一群落增加第二个栖息地「湖泊」，把普通翠鸟放入。它与树冠里的戴胜合计两只攀禽。'}[r.bird];
      return `<h1>认出来了</h1><div class="sj-stop">${fieldSpecimen(r.bird)}<p class="sj-rule-note"><b>牌桌规则</b>　${instruction}</p></div>${action('placeBird','放入'+r.land+'景观 →')}`;
    }
    if (trip.phase==='choice') {
      const late = trip.step===2;
      const owned = trip.found.map(key => `<span>${species[key].name} · ${species[key].cat}</span>`).join('');
      const options = late ? action('collectGuide','收下四分图鉴','sj-primary','B2') : `<div class="sj-route-choices">
        <button class="sj-path-card" data-action="collectGuide" data-value="A12">${picture('shanyang-bridge','山阳桥岸树','sj-path-scene')}<span class="sj-path-caption">${birdArt('banjiu')}<span><b>现在收两分图鉴</b><small>最后一站用手里的斑鸠打出，当场记 2 分。</small></span></span></button>
        <button class="sj-path-card" data-action="walk">${picture('chenshan-water','辰山水岸','sj-path-scene')}<span class="sj-path-caption">${birdArt('cuiniao')}<span><b>再走一站 · 水岸</b><small>去找翠鸟，争取留住夜鹭，把面值 4 分的图鉴收入储备。</small></span></span></button></div>`;
      return `<h1>${late?'收下水岸图鉴':'现在收，还是再等一只？'}</h1><div class="sj-ribbon">${owned}</div>
        <p class="sj-deck">${late?'戴胜与翠鸟同属攀禽，夜鹭补上一只涉禽。这张图鉴允许保留夜鹭。':'离收队还有一站。你手里有一只珠颈斑鸠，正好能住进树冠图鉴。'}</p>${options}`;
    }
    if (trip.phase==='cash') return `<h1>让两分落袋</h1><div class="sj-stop">${fieldSpecimen('banjiu')}<p class="sj-rule-note">你提前收到了树冠图鉴。现在是下一次行动的构建步骤，把它和手里的珠颈斑鸠一起打出。</p></div>${action('playGuide','打出树冠图鉴和斑鸠 →')}`;
    const g=trip.guide, result=trip.receipt, long=g.id==='B2', player=trip.state.players[0];
    return `<h1>这一趟的观鸟手记</h1><div class="sj-finish-grid"><figure class="sj-stop-art">${picture(long?'chenshan-water':'shanyang-bridge',long?'辰山水岸':'山阳桥')}<figcaption>${long?'辰山水岸':'山阳桥'}</figcaption></figure><div><div class="sj-stop sj-result"><div class="sj-result-bird">${birdArt(long?'yelu':'banjiu')}</div><div>
      <span class="sj-result-tag">路线纪念章</span><h2>${long?'水岸守候':'桥边初见'}</h2><p>${long?'走到水岸，四分图鉴收入储备，夜鹭留在原树冠。':'提前收图鉴，再用珠颈斑鸠打出树冠，已经记下两分。'}</p>
      <p>认出 ${trip.found.length} 种鸟 · ${result.returned} 只鸟飞离原群落</p></div></div>
      <div class="sj-ledger"><span>当前得分<b>${G.currentScore(trip.state,0)} 分</b></span><span>储备图鉴<b>${player.reserve.length} 张</b></span><span>此刻若结算<b>${G.finalScore(trip.state,0)} 分</b></span></div>
      <p class="sj-deck">${long?'四分是这张图鉴打出后的分值。留在储备区过终局，这张牌扣一分。':'已打出的两分图鉴计入得分，储备区没有扣分。'}</p></div></div>
      <div class="sj-actions">${action('setup','进入自由牌局 →')}${action('again','重走这条路线','sj-secondary')}${action('home','回到封面','sj-back')}</div>`;
  }
  function route() {
    if (!trip) trip=newTrip();
    paint('route', `<article class="sj-page"><p class="sj-eye">辰山冬日寻鸟</p>${routebar()}${tripBody()}
      <p class="sj-cite">实地线索来自${cite('birds')}。路线中的牌局由游戏规则结算。</p></article>`);
  }
  function identify(key) {
    if (view!=='route' || trip.phase!=='identify') return;
    const r=D.route[trip.step];
    if(key!==r.bird){ document.getElementById('sj-feedback').textContent=r.hint; return; }
    trip.phase='place';
    BGM.sfx('collect');
    route();
  }
  function placeBird() {
    if (trip.phase!=='place') return;
    const r=D.route[trip.step], state=trip.state, group=state.players[0].groups[0];
    const index=state.deck.indexOf(r.bird);
    if(index<0 || !G.birdLegal(r.bird,r.land)) throw new Error('Invalid field route');
    let habitat=group.habs.find(h=>h.ls===r.land);
    if(!habitat){ habitat={ls:r.land,guide:null,birds:[]}; group.habs.push(habitat); }
    habitat.birds.push(state.deck.splice(index,1)[0]);
    trip.found.push(r.bird);
    if(trip.step===0){ trip.step++; trip.phase='identify'; } else trip.phase='choice';
    BGM.sfx('build');
    route();
  }
  function collectGuide(id) {
    if (trip.phase!=='choice' || id!==(trip.step===2?'B2':'A12')) return;
    const g=G.GUIDE_BY_ID[id], state=trip.state;
    const pool=g.lvl===1?state.pool1:state.pool2;
    state.phase='observe';
    const result=G.obTake(state,0,g.lvl,pool.findIndex(x=>x.id===id));
    if(!result.ok) throw new Error(result.err);
    trip.guide=g; trip.receipt=result; trip.phase=id==='A12'?'cash':'result';
    if(trip.phase==='result') keepMark(id);
    BGM.sfx('observe');
    route();
  }

  function playGuide() {
    if(trip.phase!=='cash') return;
    const state=trip.state, p=state.players[0];
    // Short teaching position starts the next action after its collection.
    state.phase='play'; state.cur=0; state._collected=true; state._built=false;
    const built=G.buildHabitat(state,{reserve:p.reserve.findIndex(g=>g.id==='A12')},p.hand.indexOf('banjiu'),null);
    if(!built.ok) throw new Error(built.err);
    trip.phase='result'; keepMark('A12'); BGM.sfx('build'); route();
  }

  function entry(key) {
    const sp=species[key];
    return `<article class="sj-entry sj-species"><button type="button" data-action="birdInfo" data-value="${key}">${birdArt(key)}<span><b>${sp.name}</b><small>${D.birds[key]?'辰山实录':sp.cat}</small></span></button></article>`;
  }
  const birdDialog=document.getElementById('sj-bird-dialog');
  function birdInfo(key) {
    const sp=species[key];
    if(!sp) return;
    const observation=D.birds[key] ? `<section><h3>辰山实录</h3><p>${D.birds[key]}</p><p class="sj-cite">${cite('birds')}</p></section>` : '';
    birdDialog.innerHTML=`<div class="sj-details-head">${birdArt(key)}<div><small>观鸟手册</small><h2 id="sj-bird-name">${sp.name}</h2><p>${sp.cat}</p></div></div>
      ${observation}<section><h3>牌桌规则</h3><p>${D.tips[key] || (sp.name+'属于'+sp.cat+'，可以放入<b>'+sp.hab.join('或')+'</b>。')}</p></section>
      <form method="dialog"><button class="sj-primary">返回${view==='board'?'牌桌':'手册'}</button></form>`;
    if(!birdDialog.open) birdDialog.showModal();
  }
  birdDialog.addEventListener('click',event=>{ if(event.target===birdDialog){const r=birdDialog.getBoundingClientRect(); if(event.clientX<r.left || event.clientX>r.right || event.clientY<r.top || event.clientY>r.bottom) birdDialog.close();} });
  let inspecting=false;
  function setInspect(value) {
    inspecting=value;
    const btn=document.getElementById('sj-inspect');
    btn.setAttribute('aria-pressed',String(value));
    btn.textContent=value?'点鸟牌查阅 · 取消':'查鸟牌';
    document.body.classList.toggle('sj-inspecting',value);
  }
  function toggleInspect() { setInspect(!inspecting); }
  document.addEventListener('click',event=>{
    const card=event.target.closest('.wrap [data-sj-bird]');
    if(view!=='board'||!card) return;
    if(inspecting || !card.classList.contains('clk')){
      event.preventDefault(); event.stopPropagation();
      if(inspecting) setInspect(false);
      birdInfo(card.dataset.sjBird);
    }
  },true);
  document.addEventListener('keydown',event=>{
    const t=event.target;
    if((event.key==='Enter'||event.key===' ') && t.matches('[role="button"]:not(button)')){
      event.preventDefault(); t.click();
    } else if((event.key==='i'||event.key==='I')&&t.dataset.sjBird){event.preventDefault();birdInfo(t.dataset.sjBird);}
  });

  function journal(tab) {
    if(view!=='journal') { journalReturn=view; journalTab='birds'; }
    if(tab) journalTab=tab;
    const tabs=[['birds','鸟类手册'],['sites','六处景观'],['stamps','云间印章']];
    let content='';
    if(journalTab==='birds') {
      const local=Object.keys(D.birds);
      const others=Object.keys(species).filter(k=>!D.birds[k]);
      content=`<div class="sj-section-head"><h2>辰山有记录的五种鸟</h2></div><div class="sj-library">${local.map(entry).join('')}</div>
        <p class="sj-cite">观察记述依据${cite('birds')}。</p>
        <details class="sj-stop"><summary>其余 ${others.length} 种鸟的出牌手记</summary><p>这些条目介绍牌面用途，点击卡牌时请按牌面景观安置。</p><div class="sj-library">${others.map(entry).join('')}</div></details>`;
    } else if(journalTab==='sites') {
      content='<div class="sj-sites-list">'+Object.entries(D.places).map(([l,p])=>`<article class="sj-entry"><h3>${landArt(l)}${p.name}</h3><p>${l}牌 · ${p.note}</p><p class="sj-cite">${cite(p.source)}</p></article>`).join('')+'</div>';
    } else {
      content='<p class="sj-deck">按自己已打出的景观领印，每人一局限领一枚。对照下面的景观组合规划下一手。</p><div class="sj-sites-list">'+G.ACH.map(a=>`<article class="sj-entry"><h3>${stamp(a.id)} · ${a.pts} 分</h3><p>${Object.entries(a.req).map(([l,n])=>l+' × '+n).join('　')}</p></article>`).join('')+'</div>';
    }
    paint('journal',`<article class="sj-page">${action('return','← 返回','sj-back')}<h1>松江观鸟手册</h1>
      <nav class="sj-tabs" aria-label="手册分类">${tabs.map(([k,t])=>action('journalTab',t,k===journalTab?'sj-primary':'sj-secondary',k)).join('')}</nav>${content}</article>`);
  }
  function returnToPage() {
    if(journalReturn==='route') return route();
    if(journalReturn==='setup') return setup();
    if(journalReturn==='board' && UI.state) return enterBoard();
    home();
  }

  function setup() {
    const options=(active)=>G.STYLE_ORDER.map(k=>`<option value="${k}" ${k===active?'selected':''}>${persona(k).name}（${persona(k).style}）</option>`).join('');
    const rows=['rush','tall','wide'].map((k,i)=>`<div class="sj-choice-row" id="sj-seat-${i+1}"><label for="s${i+1}">鸟友 ${i+1}</label><select id="s${i+1}">${options(k)}</select><input type="hidden" id="k${i+1}" value="${i===0?'cpu':'none'}"></div>`).join('');
    paint('setup',`<article class="sj-page sj-setup">${action('home','← 返回封面','sj-back')}<div class="sj-setup-grid"><figure class="sj-stop-art">${picture('chenshan-meadow','辰山冬日下午的草地')}<figcaption>辰山草坪</figcaption></figure><div><h1>自由牌局</h1><p class="sj-deck">和松江鸟友共用一桌图鉴。每回合先采鸟，再建群落，凑齐卡上的禽类组合就能观鸟。</p>
      <div class="sj-stop"><div class="sj-choice-row"><label for="sj-count">同桌人数</label><select id="sj-count"><option value="2">2 人 · 你和一位鸟友</option><option value="3">3 人 · 两位鸟友</option><option value="4">4 人 · 三位鸟友</option></select></div>
      ${rows}<label class="sj-check"><input id="stretch" type="checkbox" checked>加入六种扩展鸟牌</label>
      ${action('start',UI.state&&!UI.state.gameOver?'开始新牌局 →':'开始牌局 →')}</div><p class="sj-meta">五位鸟友都是游戏角色，各有偏好的打法。</p></div></div></article>`);
    seatCount();
  }
  function seatCount() {
    const n=Number(document.getElementById('sj-count').value);
    for(let i=1;i<=3;i++){
      document.getElementById('k'+i).value=i<n?'cpu':'none';
      document.getElementById('sj-seat-'+i).hidden=i>=n;
    }
  }
  function enterBoard() {
    view='board'; document.body.dataset.sjView='board'; screen.hidden=true; clearOverlay(); setInspect(false); window.scrollTo(0,0);
  }
  function beforeTurn(st,actor) {
    return {guides:st.pool1.length+st.pool2.length, sites:new Set(G.allHabs(actor)), ach:actor.ach, phase:st.phase};
  }
  function comment(st,actor,prev) {
    const el=document.getElementById('sj-comment');
    const role=persona(actor.style);
    let event='';
    if(actor.ach!==prev.ach && actor.ach!=null) event='领到了「'+stamp(actor.ach)+'」印章。';
    else if(st.pool1.length+st.pool2.length<prev.guides && actor.reserve.length){
      const g=actor.reserve[actor.reserve.length-1]; event='收走了'+g.pts+'分的'+g.ls+'图鉴。';
    } else {
      const added=G.allHabs(actor).find(h=>!prev.sites.has(h));
      if(added) event='在'+place(added.ls).short+'打出'+added.ls+'景观'+(added.birds[0]?'，安置了'+species[added.birds[0]].name:'')+'。';
      else if(prev.phase==='observe') event='结束了本轮观鸟。';
      else event='完成了采集与构建。';
    }
    el.hidden=false; el.textContent=role.short+'　'+event;
  }

  screen.addEventListener('click',e=>{
    const b=e.target.closest('button[data-action]'); if(!b) return;
    const v=b.dataset.value;
    switch(b.dataset.action){
      case 'home': home(); break;
      case 'journal': journal(); break;
      case 'sites': journal('sites'); break;
      case 'birdInfo': birdInfo(v); break;
      case 'journalTab': journal(v); break;
      case 'return': returnToPage(); break;
      case 'sound': BGM.toggle(); b.textContent=soundLabel(); break;
      case 'setup': setup(); break;
      case 'start': document.getElementById('sj-comment').hidden=true; UI.startLocal(); break;
      case 'board': enterBoard(); break;
      case 'route': if(!trip||trip.phase==='result') trip=newTrip(); route(); break;
      case 'again': trip=newTrip(); route(); break;
      case 'identify': identify(v); break;
      case 'placeBird': placeBird(); break;
      case 'playGuide': playGuide(); break;
      case 'walk': if(trip.phase==='choice' && trip.step===1){ trip.step=2; trip.phase='identify'; route(); } break;
      case 'collectGuide': collectGuide(v); break;
    }
  });
  screen.addEventListener('change',e=>{ if(e.target.id==='sj-count') seatCount(); });
  return {home,setup,journal,place,persona,stamp,birdNote,birdInfo,toggleInspect,enterBoard,beforeTurn,comment};
})();


</script>
</body>
</html>
